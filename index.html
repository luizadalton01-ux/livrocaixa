            <p class="ledger-desc">${esc(t.descricao)}</p>
            <p class="muted small">${esc(t.categoria)} · ${esc(accName)}</p>
          </div>
          <span class="amount ${t.tipo}">${t.tipo==='entrada'?'+':'−'} ${fmtBRL(t.valor)}</span>
        </li>`;
      }).join('')}</ul>
    </div>`).join('')}</div>`;
}

function txAvailableYears(){
  const pool = txFilterAccountId ? transactions.filter(t => t.contaId === txFilterAccountId) : transactions;
  const years = new Set(pool.map(t => parseInt(t.data.slice(0,4), 10)));
  years.add(new Date().getFullYear());
  return [...years].sort((a,b) => b-a);
}

function renderTransactions(){
  const warn = !accounts.length ? `<p class="muted small">Cadastre uma conta bancária antes de lançar transações.</p>` : '';

  // barra lateral: contas ativas primeiro, depois inativas (sombreadas)
  const ativos = accounts.filter(a => a.ativo !== false).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const inativos = accounts.filter(a => a.ativo === false).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  const sidebarItem = (a) => `
    <button class="acct-chip ${a.ativo===false?'inactive':''} ${accountBalanceToneClass(balanceOfToday(a.id))} ${txFilterAccountId===a.id?'active':''}" data-action="filter-account" data-id="${a.id}">
      ${esc(a.nome)}
      <span class="acct-chip-balance ${balancesHidden?'balance-masked':''}">${maskBalance(fmtBRL(balanceOfToday(a.id)))}</span>
    </button>`;

  const sidebar = accounts.length ? `<aside class="tx-sidebar">
    <button class="acct-chip acct-chip-all ${txFilterAccountId===null?'active':''}" data-action="filter-account" data-id="">Todas as contas</button>
    ${ativos.map(sidebarItem).join('')}
    ${inativos.length ? `<div class="acct-sidebar-divider"></div>${inativos.map(sidebarItem).join('')}` : ''}
  </aside>` : '';

  // filtro de período: últimos 7 dias (padrão), mês inteiro ou ano inteiro
  const years = txAvailableYears();
  const now = new Date();
  const selMonth = txPeriod.mode === 'month' ? (txPeriod.month || now.getMonth()+1) : now.getMonth()+1;
  const selYear = (txPeriod.mode === 'month' || txPeriod.mode === 'year') ? (txPeriod.year || now.getFullYear()) : now.getFullYear();

  const periodControls = `
    <div class="period-row">
      <button class="chip ${txPeriod.mode==='recent'?'active':''}" data-action="set-period-recent">Últimos 7 dias</button>
      <button class="chip ${txPeriod.mode==='month'?'active':''}" data-action="set-period-month">Mês</button>
      <button class="chip ${txPeriod.mode==='year'?'active':''}" data-action="set-period-year">Ano</button>
    </div>
    ${txPeriod.mode==='month' ? `<div class="period-row">
      <select id="txMonthSelect">${MONTH_NAMES.map((m,i) => `<option value="${i+1}" ${i+1===selMonth?'selected':''}>${m}</option>`).join('')}</select>
      <select id="txYearSelect">${years.map(y => `<option value="${y}" ${y===selYear?'selected':''}>${y}</option>`).join('')}</select>
    </div>` : ''}
    ${txPeriod.mode==='year' ? `<div class="period-row">
      <select id="txYearOnlySelect">${years.map(y => `<option value="${y}" ${y===selYear?'selected':''}>${y}</option>`).join('')}</select>
    </div>` : ''}`;

  const tipoFilters = `<div class="filter-row">
    ${['todos','entrada','saida'].map(f => `
    <button class="chip ${filterTipo===f?'active':''}" data-action="filter-transactions" data-value="${f}">
      ${f==='todos'?'Todas':f==='entrada'?'Entradas':'Saídas'}
    </button>`).join('')}
    <button class="chip chip-warn ${filterConsolidado==='pendentes'?'active':''}" data-action="toggle-filter-consolidado">Não consolidadas</button>
  </div>`;

  // aplica filtros: conta > tipo > consolidado > período
  let filtered = transactions.filter(t => filterTipo==='todos' || t.tipo===filterTipo);
  if(txFilterAccountId) filtered = filtered.filter(t => t.contaId === txFilterAccountId);
  if(filterConsolidado === 'pendentes') filtered = filtered.filter(t => !t.consolidado);
  if(txPeriod.mode === 'recent'){
    const start = last7DaysStart();
    filtered = filtered.filter(t => t.data >= start && t.data <= todayStr());
  } else if(txPeriod.mode === 'year'){
    const y = String(selYear);
    filtered = filtered.filter(t => t.data.slice(0,4) === y);
  } else {
    const key = `${selYear}-${String(selMonth).padStart(2,'0')}`;
    filtered = filtered.filter(t => t.data.slice(0,7) === key);
  }

  const periodLabel = txPeriod.mode === 'recent' ? 'nos últimos 7 dias'
    : txPeriod.mode === 'year' ? `em ${selYear}`
    : `em ${MONTH_NAMES[selMonth-1]}/${selYear}`;
  const emptyExtra = `${txFilterAccountId ? ' nesta conta' : ''}${filterConsolidado==='pendentes' ? ' não consolidadas' : ''}`;
  lastTxFilteredIds = filtered.map(t => t.id);
  const ledgerHtml = filtered.length
    ? (txFilterAccountId ? renderDayGroupedLedger(txFilterAccountId, filtered, true) : renderDayGroupedLedgerMulti(filtered))
    : emptyState(ICONS.empty1, 'Nenhuma transação', `Sem lançamentos ${periodLabel}${emptyExtra}.`);

  return `<div class="tx-layout">
    ${sidebar}
    <div class="tx-main">
      <div class="section-head"><h2>Transações</h2>
        <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">

          ${filtered.length ? `<button class="btn-ghost small" data-action="toggle-select-mode-tx">${txSelectMode ? 'Cancelar' : 'Selecionar'}</button>` : ''}
        </div>
      </div>
      ${warn}
      <div class="filters-panel">
        ${periodControls}
        ${tipoFilters}
      </div>
      ${txSelectMode ? selectionBar(selectedTx.size, lastTxFilteredIds.length, 'bulk-delete-tx', 'toggle-select-mode-tx', 'select-all-tx', 'transação', 'transações') : ''}
      ${ledgerHtml}
    </div>
  </div>`;
}

/* =========================== bills =========================== */
function renderBills(){
  const list = [...bills].filter(b => filterBills==='todas' || (filterBills==='pendentes' ? !b.pago : b.pago))
    .sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  lastBillsListIds = list.map(b => b.id);

  const notifSupported = notificationsSupported();
  const notifPerm = notifSupported ? Notification.permission : 'unsupported';
  const notifHtml = !notifSupported ? '' : notifPerm === 'granted'
    ? `<p class="muted small notif-status">🔔 Notificações de vencimento ativadas (1 dia antes às 11h/15h, e no dia a cada 2h das 10h às 22h, até marcar como paga)</p>
       <button class="btn-ghost small" data-action="test-notification" style="margin-bottom:8px;">Testar notificação agora</button>`
    : notifPerm === 'denied'
    ? `<p class="muted small notif-status">🔕 Notificações bloqueadas nas configurações do navegador. Ative manualmente para receber avisos de vencimento.</p>`
    : `<button class="btn-ghost" data-action="enable-notifications" style="margin-bottom:2px;">🔔 Ativar notificações de vencimento</button>`;

  const filters = `<div class="filter-row">${['pendentes','pagas','todas'].map(f => `
    <button class="chip ${filterBills===f?'active':''}" data-action="filter-bills" data-value="${f}">
      ${f[0].toUpperCase()+f.slice(1)}
    </button>`).join('')}</div>`;

  const body = list.length ? `<ul class="reminder-list">${list.map(b => {
    const status = billStatus(b); const [label,color] = stampLabel(status); const d = daysUntil(b.vencimento);
    const sel = billSelectMode && selectedBills.has(b.id);
    return `<li class="reminder-row ${billSelectMode ? 'select-mode' : ''} ${sel ? 'selected' : ''}" data-action="${billSelectMode ? 'toggle-select-bill' : ''}" data-id="${b.id}">
      ${billSelectMode ? `<span class="select-check ${sel?'on':''}">${sel ? ICONS.check2 : ''}</span>` : (status==='vencido' ? ICONS.warn : '')}
      <div style="flex:1">
        <p class="reminder-desc">${esc(b.descricao)} ${b.recorrente ? '<span class="muted small">(recorrente)</span>' : ''}</p>
        <p class="muted small">vence ${fmtDate(b.vencimento)} · ${esc(b.categoria)}
          ${!b.pago ? ' · ' + (d<0?`${Math.abs(d)} dia(s) atrasado`:d===0?'vence hoje':`em ${d} dia(s)`) : ''}
          ${b.pago ? ' · pago em ' + fmtDate(b.dataPagamento) : ''}</p>
      </div>
      <div class="reminder-right">
        <span class="amount">${fmtBRL(b.valor)}</span>
        <span class="stamp" style="border-color:${color};color:${color}">${label}</span>
        ${!billSelectMode ? `
        ${!b.pago ? `<button class="btn-ghost" data-action="mark-paid" data-id="${b.id}">Marcar paga</button>` : ''}
        <button class="icon-btn danger" data-action="delete-bill" data-id="${b.id}">${ICONS.trash}</button>` : ''}
      </div>
    </li>`;
  }).join('')}</ul>` : emptyState(ICONS.receipt,'Nada por aqui','Cadastre contas a pagar para acompanhar vencimentos.');

  // transações lançadas que ainda não foram consolidadas (passadas e futuras)
  const hoje = todayStr();
  const naoConsolidadas = transactions.filter(t => !t.consolidado);
  const passadas = naoConsolidadas.filter(t => t.data < hoje).sort((a,b) => a.data.localeCompare(b.data));
  const futuras = naoConsolidadas.filter(t => t.data >= hoje).sort((a,b) => a.data.localeCompare(b.data));

  const naoConsolidadasPanel = `
    <div class="panel">
      <h2>Transações não consolidadas</h2>
      <p class="muted small" style="margin:-6px 0 14px 0;">Lançamentos ainda não confirmados como efetivados no banco — passados e futuros. Toque na bolinha para marcar como consolidada.</p>
      <p class="muted small" style="font-weight:600; margin-bottom:4px;">Passadas (${passadas.length})</p>
      ${renderDayGroupedLedgerMulti(passadas)}
      <p class="muted small" style="font-weight:600; margin:18px 0 4px 0;">Futuras (${futuras.length})</p>
      ${renderDayGroupedLedgerMulti(futuras)}
    </div>`;

  return `<div class="stack">
    <div class="section-head"><h2>Contas a pagar</h2>
      ${list.length ? `<button class="btn-ghost" data-action="toggle-select-mode-bills">${billSelectMode ? 'Cancelar' : 'Selecionar'}</button>` : ''}
    </div>
    ${billSelectMode ? selectionBar(selectedBills.size, lastBillsListIds.length, 'bulk-delete-bills', 'toggle-select-mode-bills', 'select-all-bills', 'conta', 'contas') : ''}
    ${notifHtml}
    ${filters}
    ${body}
    ${naoConsolidadasPanel}
  </div>`;
}

/* =========================== editar / remover transação =========================== */
function futureOccurrencesOf(t){
  if(!t.recorrenciaId) return [];
  return transactions.filter(x => x.recorrenciaId === t.recorrenciaId && x.data > t.data);
}

function doDeleteTransaction(t, includeFuture){
  const idsToRemove = new Set();
  const addWithTransferPair = (tx) => {
    idsToRemove.add(tx.id);
    if(tx.transferId){ transactions.forEach(x => { if(x.transferId === tx.transferId) idsToRemove.add(x.id); }); }
  };
  addWithTransferPair(t);
  if(includeFuture){ futureOccurrencesOf(t).forEach(addWithTransferPair); }
  const idsArr = [...idsToRemove];
  transactions = transactions.filter(x => !idsToRemove.has(x.id));
  fsBatchDelete('transactions', idsArr);
}

// Pede confirmação antes de excluir. Se a transação faz parte de uma série recorrente
// com lançamentos futuros ainda pendentes, oferece a escolha entre excluir só esta
// ocorrência ou esta e todas as futuras da mesma série. afterDelete() só é chamado
// quando a exclusão realmente acontece (nunca em caso de cancelamento).
function confirmDeleteTransaction(t, afterDelete){
  const isTransfer = !!t.transferId;
  const futures = futureOccurrencesOf(t);
  if(futures.length === 0){
    const msg = isTransfer
      ? 'Esta transação faz parte de uma transferência entre contas. Tem certeza que deseja excluir? As DUAS pontas da transferência serão removidas. Essa ação não pode ser desfeita.'
      : 'Tem certeza que deseja excluir esta transação? Essa ação não pode ser desfeita.';
    if(!confirm(msg)) return;
    doDeleteTransaction(t, false);
    afterDelete();
    return;
  }
  openModal(`
    <p class="sheet-title">Excluir lançamento recorrente</p>
    <p class="muted small">${esc(t.descricao)} — ${fmtBRL(t.valor)}${isTransfer ? ' (transferência)' : ''}</p>
    <p class="muted small" style="margin-top:8px;">Esta transação faz parte de uma série recorrente e tem <strong>${futures.length}</strong> lançamento(s) futuro(s) ainda pendente(s). O que você deseja excluir?</p>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:14px;">
      <button class="btn-primary" type="button" id="delOnlyThisBtn">Excluir só esta</button>
      <button class="btn-ghost" type="button" id="delThisAndFutureBtn" style="color:var(--brick); border-color:var(--brick);">Excluir esta e as ${futures.length} futura(s)</button>
      <button class="btn-ghost" type="button" id="delCancelChoiceBtn">Cancelar</button>
    </div>`);
  sheet.classList.add('sheet-compact');
  document.getElementById('delOnlyThisBtn').addEventListener('click', () => { doDeleteTransaction(t, false); afterDelete(); });
  document.getElementById('delThisAndFutureBtn').addEventListener('click', () => { doDeleteTransaction(t, true); afterDelete(); });
  document.getElementById('delCancelChoiceBtn').addEventListener('click', () => { closeModal(); });
}

document.body.addEventListener('submit', (e) => {
  if(e.target.id === 'editTransactionForm'){
    e.preventDefault();
    if(!confirm(CONFIRM_MSG)) return;
    const f = new FormData(e.target);
    const id = e.target.dataset.id;
    const tipo = f.get('tipo');
    const valor = parseCurrencyBRL(f.get('valor'));
    const data = f.get('data');
    const descricao = (f.get('descricao')||'').trim() || '(sem descrição)';
    const consolidado = f.get('consolidado') === 'on';
    const contaId = f.get('contaId');
    const original = transactions.find(x => x.id === id);
    if(!original){ closeModal(); render(); return; }
    const pair = original.transferId ? transactions.find(x => x.transferId === original.transferId && x.id !== id) : null;

    if(tipo === 'transferencia'){
      const contaDestinoId = f.get('contaDestinoId');
      if(!contaDestinoId || contaDestinoId === contaId){
        alert('Selecione uma conta de destino diferente da conta de origem.');
        return;
      }
      const transferId = original.transferId || uid();
      if(pair){
        // atualiza as duas pontas já existentes
        Object.assign(original, { tipo:'saida', valor, data, descricao, categoria:'Transferência', contaId, consolidado, transferId });
        Object.assign(pair, { tipo:'entrada', valor, data, descricao, categoria:'Transferência', contaId:contaDestinoId, consolidado, transferId });
        fsBatchSet('transactions', [original, pair]);
      } else {
        // transforma a transação avulsa em uma transferência (cria a outra ponta)
        Object.assign(original, { tipo:'saida', valor, data, descricao, categoria:'Transferência', contaId, consolidado, transferId });
        const novo = { id:uid(), tipo:'entrada', valor, data, descricao, categoria:'Transferência', contaId:contaDestinoId, consolidado, transferId };
        transactions.push(novo);
        fsBatchSet('transactions', [original, novo]);
      }
    } else {
      // remove o vínculo de transferência, se houver, e apaga a outra ponta
      if(pair){ transactions = transactions.filter(x => x.id !== pair.id); fsDeleteDoc('transactions', pair.id); }
      Object.assign(original, { tipo, valor, data, descricao, categoria: f.get('categoria'), contaId, consolidado, transferId: undefined });
      delete original.transferId;
      fsSetDoc('transactions', original);
    }

    closeModal();
    render();
  }
});

document.body.addEventListener('submit', (e) => {
  if(e.target.id === 'accountForm'){
    e.preventDefault();
    if(!confirm(CONFIRM_MSG)) return;
    const f = new FormData(e.target);
    const editId = e.target.dataset.id;
    if(editId){
      const acc = accounts.find(a => a.id === editId);
      if(acc){
        acc.nome = f.get('nome').trim();
        acc.banco = f.get('banco').trim();
        acc.tipo = f.get('tipo');
        acc.saldoInicial = parseCurrencyBRL(f.get('saldoInicial'));
        fsSetDoc('accounts', acc);
      }
    } else {
      const novaConta = { id:uid(), nome:f.get('nome').trim(), banco:f.get('banco').trim(), tipo:f.get('tipo'), saldoInicial: parseCurrencyBRL(f.get('saldoInicial')), ativo:true };
      accounts.push(novaConta);
      fsSetDoc('accounts', novaConta);
    }
    closeModal(); render();
  }
  if(e.target.id === 'transactionForm'){
    e.preventDefault();
    if(!confirm(CONFIRM_MSG)) return;
    const f = new FormData(e.target);
    const tipo = f.get('tipo');
    const contaId = f.get('contaId');
    const valor = parseCurrencyBRL(f.get('valor'));
    const dataBase = f.get('data');
    const descricao = (f.get('descricao')||'').trim();
    const consolidadoChecked = f.get('consolidado') === 'on';
    const returnTo = f.get('returnTo');
    const recorrente = document.getElementById('recorrenteCheck').checked;
    const freq = f.get('frequencia');
    const ocorrencias = recorrente ? Math.min(60, Math.max(1, parseInt(f.get('ocorrencias'),10) || 1)) : 1;
    const today = todayStr();
    const newTxs = [];

    if(tipo === 'transferencia'){
      const contaDestinoId = f.get('contaDestinoId');
      if(!contaDestinoId || contaDestinoId === contaId){
        alert('Selecione uma conta de destino diferente da conta de origem.');
        return;
      }
      const desc = descricao || 'Transferência entre contas';
      const recorrenciaId = ocorrencias > 1 ? uid() : null;
      for(let i = 0; i < ocorrencias; i++){
        const data = i === 0 ? dataBase : addRecurrence(dataBase, freq, i);
        const consolidado = consolidadoChecked && data <= today;
        const transferId = uid();
        const t1 = { id:uid(), tipo:'saida', valor, data, descricao:desc, categoria:'Transferência', contaId, consolidado, transferId, recorrenciaId };
        const t2 = { id:uid(), tipo:'entrada', valor, data, descricao:desc, categoria:'Transferência', contaId:contaDestinoId, consolidado, transferId, recorrenciaId };
        transactions.push(t1); transactions.push(t2);
        newTxs.push(t1, t2);
      }
      expandedGroups.add(contaId); expandedGroups.add(contaDestinoId);
    } else {
      const categoria = f.get('categoria');
      const desc = descricao || '(sem descrição)';
      const recorrenciaId = ocorrencias > 1 ? uid() : null;
      for(let i = 0; i < ocorrencias; i++){
        const data = i === 0 ? dataBase : addRecurrence(dataBase, freq, i);
        const consolidado = consolidadoChecked && data <= today;
        const t1 = { id:uid(), tipo, valor, data, descricao:desc, categoria, contaId, consolidado, recorrenciaId };
        transactions.push(t1);
        newTxs.push(t1);
      }
      expandedGroups.add(contaId);
    }
    fsBatchSet('transactions', newTxs);

    if(returnTo === 'statement'){
      render();
      openAccountStatement(contaId, parseInt(dataBase.slice(5,7),10), parseInt(dataBase.slice(0,4),10));
    } else {
      closeModal(); render();
    }
  }
  if(e.target.id === 'billForm'){
    e.preventDefault();
    if(!confirm(CONFIRM_MSG)) return;
    const f = new FormData(e.target);
    const novaConta = { id:uid(), descricao:f.get('descricao').trim(), valor:parseCurrencyBRL(f.get('valor')), vencimento:f.get('vencimento'),
      categoria:f.get('categoria'), contaId:f.get('contaId')||'', recorrente: f.get('recorrente')==='on', pago:false };
    bills.push(novaConta);
    fsSetDoc('bills', novaConta);
    closeModal(); render();
  }
});

document.body.addEventListener('click', (e) => {
  const navBtn = e.target.closest('.nav-btn');
  if(navBtn){
    activeTab = navBtn.dataset.tab;
    acctSelectMode = false; selectedAccounts.clear();
    txSelectMode = false; selectedTx.clear();
    billSelectMode = false; selectedBills.clear();
    render(); return;
  }

  if(e.target.id === 'fab' || e.target.closest('#fab')){
    if(activeTab==='accounts') openAccountForm();
    else if(activeTab==='transactions') openTransactionForm();
    else if(activeTab==='bills') openBillForm();
    return;
  }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action === 'delete-account'){
    const acc = accounts.find(a => a.id === btn.dataset.id);
    const nome = acc ? acc.nome : 'esta conta';
    const ok = confirm(`Tem certeza que deseja excluir a conta "${nome}"? Todas as transações dela também serão apagadas. Essa ação não pode ser desfeita.`);
    if(ok){
      const idsToRemove = transactions.filter(t => t.contaId === btn.dataset.id).map(t => t.id);
      accounts = accounts.filter(a => a.id !== btn.dataset.id);
      transactions = transactions.filter(t => t.contaId !== btn.dataset.id);
      fsDeleteDoc('accounts', btn.dataset.id);
      fsBatchDelete('transactions', idsToRemove);
      render();
    }
  }
  if(action === 'edit-account'){ openAccountForm(btn.dataset.id); }
  if(action === 'delete-transaction'){
    const ok = confirm('Tem certeza que deseja excluir esta transação? Essa ação não pode ser desfeita.');
    if(ok){
      transactions = transactions.filter(t => t.id !== btn.dataset.id);
      fsDeleteDoc('transactions', btn.dataset.id);
      if(document.getElementById('stmtResults')) refreshStatementBody();
      render();
    }
  }
  if(action === 'delete-bill'){
    const ok = confirm('Tem certeza que deseja excluir esta conta a pagar? Essa ação não pode ser desfeita.');
    if(ok){
      bills = bills.filter(b => b.id !== btn.dataset.id);
      fsDeleteDoc('bills', btn.dataset.id);
      render();
    }
  }
  if(action === 'mark-paid'){
    if(!confirm(CONFIRM_MSG)) return;
    const bill = bills.find(b => b.id === btn.dataset.id);
    if(bill){
      bill.pago = true; bill.dataPagamento = todayStr();
      fsSetDoc('bills', bill);
      if(bill.contaId){
        const novaTx = { id:uid(), tipo:'saida', valor:bill.valor, data:todayStr(), descricao:bill.descricao, categoria:bill.categoria, contaId:bill.contaId, consolidado:true };
        transactions.push(novaTx);
        fsSetDoc('transactions', novaTx);
      }
      // conta recorrente: gera automaticamente a próxima ocorrência (mês seguinte) já pendente
      if(bill.recorrente){
        const proximaConta = { id:uid(), descricao:bill.descricao, valor:bill.valor, vencimento:addRecurrence(bill.vencimento,'mes',1),
          categoria:bill.categoria, contaId:bill.contaId||'', recorrente:true, pago:false };
        bills.push(proximaConta);
        fsSetDoc('bills', proximaConta);
      }
    }
    render();
  }

  /* ---- seleção múltipla: contas ---- */
  if(action === 'toggle-select-mode-accounts'){ acctSelectMode = !acctSelectMode; selectedAccounts.clear(); render(); }
  if(action === 'toggle-select-account'){
    const id = btn.dataset.id;
    if(selectedAccounts.has(id)) selectedAccounts.delete(id); else selectedAccounts.add(id);
    render();
  }
  if(action === 'select-all-accounts'){
    if(selectedAccounts.size === lastAccountsListIds.length) selectedAccounts.clear();
    else lastAccountsListIds.forEach(id => selectedAccounts.add(id));
    render();
  }
  if(action === 'bulk-delete-accounts'){
    if(selectedAccounts.size === 0) return;
    const ids = [...selectedAccounts];
    const ok = confirm(`Tem certeza que deseja excluir ${ids.length} conta(s)? Todas as transações delas também serão apagadas. Essa ação não pode ser desfeita.`);
    if(ok){
      const idsToRemoveTx = transactions.filter(t => ids.includes(t.contaId)).map(t => t.id);
      accounts = accounts.filter(a => !ids.includes(a.id));
      transactions = transactions.filter(t => !ids.includes(t.contaId));
      ids.forEach(id => fsDeleteDoc('accounts', id));
      fsBatchDelete('transactions', idsToRemoveTx);
      acctSelectMode = false; selectedAccounts.clear();
      render();
    }
  }

  if(action === 'delete-category'){
    removeCategoria(btn.dataset.tipo, btn.dataset.cat);
    openCategoriesSheet();
  }

  /* ---- seleção múltipla: transações ---- */
  if(action === 'toggle-select-mode-tx'){ txSelectMode = !txSelectMode; selectedTx.clear(); refreshTxListsAfterSelectionChange(); }
  if(action === 'toggle-select-tx'){
    const id = btn.dataset.id;
    if(selectedTx.has(id)) selectedTx.delete(id); else selectedTx.add(id);
    refreshTxListsAfterSelectionChange();
  }
  if(action === 'select-all-tx'){
    if(selectedTx.size === lastTxFilteredIds.length) selectedTx.clear();
    else lastTxFilteredIds.forEach(id => selectedTx.add(id));
    refreshTxListsAfterSelectionChange();
  }
  if(action === 'bulk-delete-tx'){
    if(selectedTx.size === 0) return;
    const ids = new Set(selectedTx);
    transactions.forEach(t => {
      if(ids.has(t.id) && t.transferId) transactions.forEach(x => { if(x.transferId === t.transferId) ids.add(x.id); });
    });

    // Detecta ocorrências futuras de séries recorrentes que ficaram de fora da seleção.
    const futureExtra = new Set();
    transactions.forEach(t => {
      if(ids.has(t.id)) futureOccurrencesOf(t).forEach(f => { if(!ids.has(f.id)) futureExtra.add(f.id); });
    });

    const proceedWith = (finalIds) => {
      const idsArr = [...finalIds];
      const extra = idsArr.length !== selectedTx.size ? ' (inclui vínculos de transferência e/ou recorrência)' : '';
      const ok = confirm(`Tem certeza que deseja excluir ${idsArr.length} transação(ões)${extra}? Essa ação não pode ser desfeita.`);
      if(ok){
        transactions = transactions.filter(t => !finalIds.has(t.id));
        fsBatchDelete('transactions', idsArr);
        txSelectMode = false; selectedTx.clear();
        closeModal();
        render();
      }
    };

    if(futureExtra.size > 0){
      openModal(`
        <p class="sheet-title">Excluir também as futuras?</p>
        <p class="muted small">${futureExtra.size} lançamento(s) futuro(s) da(s) mesma(s) série(s) recorrente(s) não foram selecionados. Deseja excluir eles também?</p>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:14px;">
          <button class="btn-primary" type="button" id="bulkOnlySelectedBtn">Excluir só os selecionados</button>
          <button class="btn-ghost" type="button" id="bulkWithFutureBtn" style="color:var(--brick); border-color:var(--brick);">Excluir selecionados + futuros</button>
          <button class="btn-ghost" type="button" id="bulkCancelBtn">Cancelar</button>
        </div>`);
      sheet.classList.add('sheet-compact');
      document.getElementById('bulkOnlySelectedBtn').addEventListener('click', () => { closeModal(); proceedWith(ids); });
      document.getElementById('bulkWithFutureBtn').addEventListener('click', () => { closeModal(); futureExtra.forEach(id => ids.add(id)); proceedWith(ids); });
      document.getElementById('bulkCancelBtn').addEventListener('click', () => { closeModal(); });
    } else {
      proceedWith(ids);
    }
  }

  /* ---- seleção múltipla: contas a pagar ---- */
  if(action === 'toggle-select-mode-bills'){ billSelectMode = !billSelectMode; selectedBills.clear(); render(); }
  if(action === 'toggle-select-bill'){
    const id = btn.dataset.id;
    if(selectedBills.has(id)) selectedBills.delete(id); else selectedBills.add(id);
    render();
  }
  if(action === 'select-all-bills'){
    if(selectedBills.size === lastBillsListIds.length) selectedBills.clear();
    else lastBillsListIds.forEach(id => selectedBills.add(id));
    render();
  }
  if(action === 'bulk-delete-bills'){
    if(selectedBills.size === 0) return;
    const ids = [...selectedBills];
    const ok = confirm(`Tem certeza que deseja excluir ${ids.length} conta(s) a pagar? Essa ação não pode ser desfeita.`);
    if(ok){
      bills = bills.filter(b => !ids.includes(b.id));
      fsBatchDelete('bills', ids);
      billSelectMode = false; selectedBills.clear();
      render();
    }
  }
  if(action === 'filter-transactions'){ filterTipo = btn.dataset.value; render(); }
  if(action === 'toggle-filter-consolidado'){ filterConsolidado = filterConsolidado === 'pendentes' ? 'todos' : 'pendentes'; render(); }
  if(action === 'filter-account'){ txFilterAccountId = btn.dataset.id || null; render(); }
  if(action === 'set-period-recent'){ txPeriod = { mode:'recent' }; render(); }
  if(action === 'set-period-month'){ const n = new Date(); txPeriod = { mode:'month', month: txPeriod.month || n.getMonth()+1, year: txPeriod.year || n.getFullYear() }; render(); }
  if(action === 'set-period-year'){ const n = new Date(); txPeriod = { mode:'year', year: txPeriod.year || n.getFullYear() }; render(); }
  if(action === 'filter-bills'){ filterBills = btn.dataset.value; render(); }
  if(action === 'toggle-tx-group'){
    const id = btn.dataset.id;
    if(expandedGroups.has(id)) expandedGroups.delete(id); else expandedGroups.add(id);
    render();
  }
  if(action === 'load-more-tx'){
    const id = btn.dataset.id;
    groupVisible[id] = (groupVisible[id] || 20) + 20;
    render();
  }

  if(action === 'toggle-account-active'){
    if(!confirm(CONFIRM_MSG)) return;
    const acc = accounts.find(a => a.id === btn.dataset.id);
    if(acc){
      acc.ativo = acc.ativo === false ? true : false;
      fsSetDoc('accounts', acc);
    }
    persist();
    render();
  }
  if(action === 'open-search'){ openSearchSheet(); }
  if(action === 'save-cloud'){ saveToCloud(); }
  if(action === 'enable-notifications'){
    requestNotificationPermission().then((perm) => {
      if(perm === 'granted'){ checkBillReminders(); }
      render();
    });
  }
  if(action === 'test-notification'){
    fireBillNotification({ id:'teste', descricao:'Notificação de teste do Livro-Caixa', valor:0 }, 0)
      .then(() => alert('Se a notificação não apareceu em alguns segundos, confira se as notificações do navegador/app estão liberadas nas configurações do celular (fora do app).'));
  }
  if(action === 'retry-charts'){
    chartRetryCount = 0;
    if (typeof Chart === 'undefined' && window.chartJsFailed) {
      window.chartJsFailed = false;
      window.loadChartJs(window.chartJsSources, 0);
    }
    renderCharts();
  }
  if(action === 'open-account-statement'){ openAccountStatement(btn.dataset.id); }
  if(action === 'edit-transaction'){ openEditTransactionForm(btn.dataset.id); }
  if(action === 'add-tx-to-account'){ openTransactionForm(btn.dataset.id); }
  if(action === 'toggle-consolidado'){
    const tx = transactions.find(x => x.id === btn.dataset.id);
    if(tx){
      const marcandoComoConsolidada = !tx.consolidado;
      const msg = marcandoComoConsolidada
        ? `Confirma que esta transação já foi consolidada (efetivada no banco)?\n\n${tx.descricao} — ${fmtBRL(tx.valor)}`
        : CONFIRM_MSG;
      if(!confirm(msg)) return;
      tx.consolidado = marcandoComoConsolidada;
      fsSetDoc('transactions', tx);
    }
    persist();
    if(document.getElementById('stmtResults')){ refreshStatementBody(); }
    else if(document.getElementById('searchResults')){
      const inp = document.getElementById('searchTxInput');
      renderSearchResults(inp ? inp.value : '');
    } else {
      render();
    }
  }
});

/* =========================== toque e segure para selecionar transação =========================== */
// Funciona em qualquer lista que use data-action="edit-transaction" (extrato de conta,
// aba Transações, busca): segurar por ~500ms entra no modo de seleção já com aquele
// item marcado — igual a tocar em "Selecionar" e depois na transação, só que num gesto só.
document.body.addEventListener('pointerdown', (e) => {
  const row = e.target.closest('[data-action="edit-transaction"]');
  if(!row) return;
  longPressTriggered = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    longPressTriggered = true;
    txSelectMode = true;
    selectedTx.add(row.dataset.id);
    if(navigator.vibrate) { try { navigator.vibrate(25); } catch(e){} }
    refreshTxListsAfterSelectionChange();
  }, 500);
});
['pointerup','pointerleave','pointercancel','scroll'].forEach(evt => {
  document.body.addEventListener(evt, () => clearTimeout(longPressTimer), true);
});
document.body.addEventListener('click', (e) => {
  if(longPressTriggered && e.target.closest('[data-action="edit-transaction"]')){
    e.preventDefault(); e.stopPropagation();
    longPressTriggered = false;
  }
}, true);

function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  if(!box) return;
  const q = query.trim().toLowerCase();
  const selectBar = document.getElementById('searchSelectBar');

  if(!q){
    box.innerHTML = `<p class="muted small" style="padding:8px 2px;">Digite para buscar entre ${transactions.length} transações.</p>`;
    lastTxFilteredIds = [];
    if(selectBar) selectBar.innerHTML = '';
    return;
  }

  const accountName = (id) => { const a = accounts.find(x=>x.id===id); return a ? a.nome : ''; };
  // normaliza o valor buscado (aceita "150", "150,00", "150.00" ou "R$ 150,00")
  const qValue = q.replace(/[^0-9,.\s]/g, '').trim();
  const matches = transactions.filter(t => {
    if((t.descricao||'').toLowerCase().includes(q)) return true;
    if((t.categoria||'').toLowerCase().includes(q)) return true;
    if(accountName(t.contaId).toLowerCase().includes(q)) return true;
    if(qValue){
      const valorFmt = fmtBRL(t.valor).toLowerCase().replace(/[^0-9,.\s]/g, '').trim();
      const valorPlano = String(t.valor).replace('.', ',');
      if(valorFmt.includes(qValue) || valorPlano.includes(qValue.replace('.', ','))) return true;
    }
    return false;
  }).sort((a,b) => b.data.localeCompare(a.data)).slice(0, 60);

  lastTxFilteredIds = matches.map(t => t.id);

  if(selectBar){
    selectBar.innerHTML = matches.length ? `
      <div style="display:flex; justify-content:flex-end; margin:6px 0;">
        <button class="btn-ghost small" type="button" data-action="toggle-select-mode-tx">${txSelectMode ? 'Cancelar' : 'Selecionar'}</button>
      </div>
      ${txSelectMode ? selectionBar(selectedTx.size, lastTxFilteredIds.length, 'bulk-delete-tx', 'toggle-select-mode-tx', 'select-all-tx', 'transação', 'transações') : ''}
    ` : '';
  }

  if(!matches.length){ box.innerHTML = `<p class="muted small" style="padding:8px 2px;">Nenhuma transação encontrada.</p>`; return; }

  box.innerHTML = `
    <p class="muted small" style="padding:4px 2px 8px 2px;">${matches.length}${matches.length===60?'+':''} resultado(s)</p>
    ${matches.map(t => {
      const sel = txSelectMode && selectedTx.has(t.id);
      return `
    <div class="ledger-row clickable ${sel ? 'selected' : ''}" data-action="${txSelectMode ? 'toggle-select-tx' : 'edit-transaction'}" data-id="${t.id}">
      ${txSelectMode
        ? `<span class="select-check ${sel?'on':''}">${sel ? ICONS.check2 : ''}</span>`
        : `<button class="consolidado-toggle ${t.consolidado?'on':''}" data-action="toggle-consolidado" data-id="${t.id}" title="${t.consolidado?'Consolidada':'Pendente'}">${t.consolidado ? ICONS.check2 : ''}</button>`}
      <span class="dot ${t.tipo}"></span>
      <div class="ledger-main">
        <p class="ledger-desc">${esc(t.descricao)}</p>
        <p class="muted small">${fmtDate(t.data)} · ${esc(t.categoria)} · ${esc(accountName(t.contaId))}</p>
      </div>
      <span class="amount ${t.tipo}">${t.tipo==='entrada'?'+':'−'} ${fmtBRL(t.valor)}</span>
    </div>`;
    }).join('')}`;
}

/* =========================== exportar dados (transações) =========================== */
async function saveToCloud(){
  const payload = JSON.stringify({ accounts, transactions, bills });
  const filename = `livro-caixa-backup-${todayStr()}.json`;
  const file = new File([payload], filename, { type: 'application/json' });

  // Usa o menu de compartilhar do celular (permite salvar direto no Google Drive,
  // iCloud, Dropbox etc.) quando disponível; senão, baixa o arquivo normalmente.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Backup Livro-Caixa', text: 'Backup dos dados do Livro-Caixa' });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return; // usuário cancelou
      // se falhar, cai no download abaixo
    }
  }
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* =========================== import / export =========================== */
function categoryChip(nome, tipo){

    ${esc(nome)}
    <button type="button" data-action="delete-category" data-tipo="${tipo}" data-cat="${esc(nome)}" style="background:none; border:none; color:var(--brick); font-weight:700; cursor:pointer; padding:0; line-height:1;">×</button>
  </span>`;
}

function openCategoriesSheet(){
  openModal(`
    <p class="sheet-title">Gerenciar categorias</p>
    <p class="muted small" style="margin:-6px 0 16px 0">Usadas ao lançar entradas e saídas. Excluir uma categoria não altera lançamentos já feitos com ela.</p>

    <div class="field"><span>Categorias de entrada</span>
      <div style="display:flex; flex-wrap:wrap; margin-top:6px;">${CAT_ENTRADA.map(c => categoryChip(c, 'entrada')).join('') || '<span class="muted small">Nenhuma</span>'}</div>
      <div style="display:flex; gap:6px; margin-top:8px;">
        <input type="text" id="newCatEntrada" placeholder="Nova categoria de entrada" style="flex:1;">
        <button class="btn-ghost small" type="button" id="addCatEntradaBtn">Adicionar</button>
      </div>
    </div>

    <div class="field" style="margin-top:16px;"><span>Categorias de saída</span>
      <div style="display:flex; flex-wrap:wrap; margin-top:6px;">${CAT_SAIDA.map(c => categoryChip(c, 'saida')).join('') || '<span class="muted small">Nenhuma</span>'}</div>
      <div style="display:flex; gap:6px; margin-top:8px;">
        <input type="text" id="newCatSaida" placeholder="Nova categoria de saída" style="flex:1;">
        <button class="btn-ghost small" type="button" id="addCatSaidaBtn">Adicionar</button>
      </div>
    </div>
  `);
  sheet.classList.add('sheet-compact');

  const addBtn = (inputId, tipo, btnId) => {
    const btn = document.getElementById(btnId);

    if(!btn || !input) return;
    const go = () => { if(addCategoria(tipo, input.value)) openCategoriesSheet(); };

    input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); go(); } });
  };

  addBtn('newCatSaida', 'saida', 'addCatSaidaBtn');

async function openDataSheet(){
  const changelogHtml = CHANGELOG.map(c => `
    <div class="changelog-entry">
      <p class="changelog-version">v${c.v} <span class="muted small">· ${fmtDate(c.data)}</span></p>
      <ul>${c.mudancas.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
    </div>`).join('');

  const existingConfig = await loadFirebaseConfig();
  const configText = existingConfig ? JSON.stringify(existingConfig, null, 2) : '';
  const statusLabel = fbSyncing ? 'Sincronizando...' : lastCloudSyncAt ? `Sincronizado ${formatRelativeSync(lastCloudSyncAt)}` : existingConfig ? 'Configurado, ainda não sincronizado' : 'Não configurado';
  const statusColor = fbSyncing ? 'var(--gold)' : fbError ? 'var(--brick)' : 'var(--ledger)';
  const localCounts = `${accounts.length} contas · ${transactions.length} transações · ${bills.length} contas a pagar (neste aparelho)`;

  openModal(`
    <p class="sheet-title">Dados do app</p>
    <p class="muted small" style="margin:-6px 0 16px 0">Importar substitui todas as contas, transações e contas a pagar atuais pelas do arquivo.</p>
    <div class="field"><span>Importar arquivo (.json)</span><input type="file" id="importFile" accept="application/json,.json"></div>
    <button class="btn-primary" id="importBtn" type="button">Importar dados</button>
    <button class="btn-ghost" id="exportBtn" type="button" style="width:100%; margin-top:10px; text-align:center;">Exportar backup (.json)</button>
    <button class="btn-ghost" id="openCategoriesBtn" type="button" style="width:100%; margin-top:10px; text-align:center;">Gerenciar categorias</button>
    <p class="muted small" id="importStatus" style="margin-top:10px;"></p>

    <div class="sheet-divider"></div>
    <p class="sheet-title" style="font-size:15px;">Sincronização em nuvem (Firebase)</p>
    <p class="muted small" style="margin:-6px 0 6px 0;">
      Status: <strong style="color:${statusColor}">${statusLabel}</strong><br>
      ${localCounts}<br>
      A sincronização acontece sozinha uma vez por dia (a partir das 7h) ou quando você toca em "Sincronizar" (no topo do app ou aqui embaixo). Depois da primeira sincronização de cada vez que você abre o app, a conexão continua ativa em segundo plano até você fechar o app — assim, sincronizações seguintes na mesma sessão ficam bem mais rápidas.
      ${fbError ? '<br><strong style="color:var(--brick)">Última sincronização teve falhas. Toque em "Sincronizar agora" novamente.</strong>' : ''}
    </p>
    <div class="field"><span>Configuração do Firebase (cole o JSON do console)</span>
      <textarea id="fbConfigInput" rows="6" style="font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:10px; border:1px solid var(--line); border-radius:9px; background:#FCFBF7; width:100%; resize:vertical;" placeholder='{&#10;  "apiKey": "...",&#10;  "authDomain": "...",&#10;  "projectId": "...",&#10;  ...&#10;}'>${esc(configText)}</textarea>
    </div>
    <button class="btn-primary" id="saveFbConfigBtn" type="button">Salvar e sincronizar</button>
    ${existingConfig ? `<button class="btn-ghost" id="removeFbConfigBtn" type="button" style="width:100%; margin-top:8px; text-align:center; color:var(--brick); border-color:var(--brick);">Desconectar</button>` : ''}
    ${existingConfig ? `<button class="btn-ghost" id="syncNowBtn" type="button" style="width:100%; margin-top:8px; text-align:center;">Sincronizar agora</button>` : ''}
    <p class="muted small" id="fbStatus" style="margin-top:10px;"></p>

    <div class="sheet-divider"></div>
    <p class="sheet-title" style="font-size:15px;">Sobre esta versão</p>
    <p class="muted small" style="margin:-8px 0 12px 0">Versão instalada: <strong style="color:var(--ink)">v${APP_VERSION}</strong></p>
    <div class="changelog-list">${changelogHtml}</div>
  `);

  const saveBtn = document.getElementById('saveFbConfigBtn');
  if(saveBtn) saveBtn.addEventListener('click', async () => {
    const status = document.getElementById('fbStatus');
    const raw = document.getElementById('fbConfigInput').value.trim();
    if(!raw){ if(status) status.textContent = 'Cole a configuração do Firebase primeiro.'; return; }
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch(e){ if(status) status.textContent = 'JSON inválido. Confira se copiou o objeto certinho, com aspas nas chaves.'; return; }
    if(!parsed.apiKey || !parsed.projectId){ if(status) status.textContent = 'Configuração incompleta (faltam apiKey/projectId).'; return; }
    if(status) status.textContent = 'Conectando e sincronizando...';
    await saveFirebaseConfig(parsed);
    await performCloudSync(true);
    if(status) status.textContent = fbError ? 'Não foi possível conectar. Confira a configuração e as regras do Firestore.' : 'Conectado e sincronizado com sucesso!';
    render();
  });

  const removeBtn = document.getElementById('removeFbConfigBtn');
  if(removeBtn) removeBtn.addEventListener('click', async () => {
    await clearFirebaseConfig();
    fbUnsubscribers.forEach(u => { try{ u(); }catch(e){} });
    fbUnsubscribers = [];
    fbReady = false;
    fbConnecting = false;
    fbError = false;
    render();
    openDataSheet();
  });

  const syncBtn = document.getElementById('syncNowBtn');
  if(syncBtn) syncBtn.addEventListener('click', async () => {
    syncBtn.disabled = true;
    await performCloudSync(true);
    syncBtn.disabled = false;
  });
}

document.body.addEventListener('click', (e) => {
  if (e.target.id === 'dataBtn' || e.target.closest('#dataBtn')) { openDataSheet(); return; }
  if (e.target.id === 'openCategoriesBtn' || e.target.closest('#openCategoriesBtn')) { openCategoriesSheet(); return; }
  if (e.target.id === 'syncNowTopBtn' || e.target.closest('#syncNowTopBtn')) { performCloudSync(true); return; }
  if (e.target.id === 'diagAlarmBtn' || e.target.closest('#diagAlarmBtn')) { openSearchSheet(); return; }

  if (e.target.id === 'exportBtn') {
    const payload = JSON.stringify({ accounts, transactions, bills }, null, 0);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `livro-caixa-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  if (e.target.id === 'importBtn') {
    const fileInput = document.getElementById('importFile');
    const status = document.getElementById('importStatus');
    const file = fileInput && fileInput.files[0];
    if (!file) { if (status) status.textContent = 'Selecione um arquivo .json primeiro.'; return; }
    if (status) status.textContent = 'Importando...';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.accounts) || !Array.isArray(data.transactions)) throw new Error('formato inválido');
        accounts = data.accounts;
        transactions = data.transactions;
        bills = Array.isArray(data.bills) ? data.bills : [];
        accounts.forEach(a => { if (a.ativo === undefined) a.ativo = true; });
        migrateData();
        persist();
        closeModal();
        render();
        const cfg = await loadFirebaseConfig();
        if(cfg && cfg.apiKey){ await performCloudSync(true); }
      } catch (err) {
        if (status) status.textContent = 'Não foi possível importar: arquivo inválido.';
      }
    };
    reader.onerror = () => { if (status) status.textContent = 'Erro ao ler o arquivo.'; };
    reader.readAsText(file);
  }
});

/* =========================== init =========================== */
function hideLoadingScreen(){
  const ls = document.getElementById('loadingScreen');
  if(ls) ls.classList.add('hide');
}
function showLoadingScreen(text){
  const ls = document.getElementById('loadingScreen');
  if(ls) ls.classList.remove('hide');
  const lt = document.getElementById('loadingText');
  if(lt && text) lt.textContent = text;
}
// espera os dados da nuvem chegarem (primeiro snapshot de cada coleção) antes de esconder
// a animação, com um teto de segurança para nunca travar a tela indefinidamente.
async function waitCloudFirstSync(maxMs){
  const start = Date.now();
  while(!fbAllFirstSnapshotsIn() && !fbError && (Date.now() - start) < maxMs){
    await new Promise(r => setTimeout(r, 150));
  }
}
const appLoadStart = Date.now();
const MIN_LOADING_MS = 550;
const MAX_CLOUD_SYNC_WAIT_MS = 25000;
loadInitialState().then(async () => {
  await loadCategorias();
  render();
  await loadSyncState();
  updateSyncBadge();
  await loadNotifiedSlots();
  checkBillReminders();
  syncAlarmsWithKodular();
  // A sincronização com a nuvem NÃO acontece mais automaticamente ao abrir o app.
  // Ela só roda sozinha uma vez por dia (a partir das 7h) ou quando a pessoa toca no
  // botão de sincronizar no topo. As duas checagens abaixo cuidam disso.
  maybeAutoSyncDaily();
  setInterval(() => { checkBillReminders(); maybeAutoSyncDaily(); }, 15 * 60 * 1000);
  const elapsed = Date.now() - appLoadStart;
  setTimeout(hideLoadingScreen, Math.max(0, MIN_LOADING_MS - elapsed));
}).catch(() => { hideLoadingScreen(); });
// segurança: nunca deixa a animação presa na tela, mesmo se algo falhar
setTimeout(hideLoadingScreen, MAX_CLOUD_SYNC_WAIT_MS + 5000);

/* =========================== impedir que o botão voltar feche o app =========================== */
// "Armadilha" de histórico: sempre que o navegador tentar voltar (botão voltar físico/gesto,
// inclusive quando o WebViewer do Kodular repassa o botão voltar do Android como navegação
// de página), a gente intercepta e decide o que fazer em vez de deixar sair do app:
// 1) se algum modal/sheet estiver aberto, fecha ele;
// 2) senão, apenas "recarrega a armadilha" e não sai de lugar nenhum.
// Isso NÃO substitui o ajuste correspondente nos blocos do Kodular (Screen1.BackPressed) —
// os dois juntos garantem que o botão físico nunca feche o app.
history.pushState({ lcTrap: true }, '', location.href);
window.addEventListener('popstate', () => {
  history.pushState({ lcTrap: true }, '', location.href);
  if(overlay.classList.contains('open')) closeModal();
});

/* =========================== PWA: service worker + install prompt =========================== */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}

let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById("installBtn");
  if (btn) btn.classList.remove("hidden");
});
document.body.addEventListener("click", (e) => {
  if (e.target.id === "installBtn" || e.target.closest("#installBtn")) {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(() => {
      deferredInstallPrompt = null;
      const btn = document.getElementById("installBtn");
      if (btn) btn.classList.add("hidden");
    });
  }
});
window.addEventListener("appinstalled", () => {
  const btn = document.getElementById("installBtn");
  if (btn) btn.classList.add("hidden");
});
