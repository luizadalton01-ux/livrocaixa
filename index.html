<script>
  // Carrega o Chart.js com CDNs alternativos de backup — se todos falharem
  // (ex: sem internet), o app avisa o script principal e segue sem travar.
  window.chartJsReady = false;
  window.chartJsFailed = false;
  window.chartJsSources = [
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js'
  ];
  window.loadChartJs = function(sources, i){
    if (i >= sources.length) { window.chartJsFailed = true; window.dispatchEvent(new Event('chartjs-unavailable')); return; }
    var s = document.createElement('script');
    s.src = sources[i];
    s.onload = function(){ window.chartJsReady = true; window.chartJsFailed = false; window.dispatchEvent(new Event('chartjs-ready')); };
    s.onerror = function(){ window.loadChartJs(sources, i + 1); };
    document.head.appendChild(s);
  };
  window.loadChartJs(window.chartJsSources, 0);
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F6F4EC; --paper-raised:#FFFFFF; --ink:#16233A; --ledger:#1B4332; --ledger-light:#2D6A4F;
    --gold:#C9A227; --brick:#B3432B; --line:#E1DCCB; --muted:#6B6553;
    --teal:#1C6E7A; --teal-light:#2E93A2; --plum:#6E4C88; --amber:#E4B84A; --rose:#C9695F;
    --shadow-sm:0 1px 3px rgba(22,35,58,0.06); --shadow-md:0 4px 16px rgba(22,35,58,0.10);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    height:100%; overscroll-behavior-y:none; }
  #app{ display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }

  /* ---- topbar ---- */
  .topbar{ background:linear-gradient(135deg, var(--ink) 0%, #1D3350 55%, var(--ledger) 130%); color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px 18px;
    position:sticky; top:0; z-index:20; box-shadow:var(--shadow-md); }
  .topbar-row{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg, var(--amber), var(--gold)); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:13px; flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.25); }
  .brand-text h1{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0; display:flex; align-items:center; gap:7px; }
  .version-badge{ font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:600; color:var(--ink);
    background:var(--gold); border-radius:10px; padding:2px 7px; letter-spacing:0.3px; }
  .brand-text p{ margin:0; font-size:11px; color:#AEB8C6; }
  .sync-badge{ color:#7BE0B8; font-weight:600; }
  .install-btn{ margin-left:8px; background:linear-gradient(135deg, var(--amber), var(--gold)); color:var(--ink); border:none; border-radius:20px;
    padding:7px 13px; font-size:11.5px; font-weight:700; font-family:'Inter',sans-serif; flex-shrink:0; }
  .install-btn.hidden{ display:none; }
  .icon-topbtn{ margin-left:auto; background:rgba(255,255,255,0.12); border:none; border-radius:8px; color:#fff;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-topbtn svg{ width:16px; height:16px; }
  @keyframes eyeBlink{ 0%{ transform:scale(1); opacity:1; } 50%{ transform:scale(0.75); opacity:0.45; } 100%{ transform:scale(1); opacity:1; } }
  #toggleBalanceBtn.blink{ animation: eyeBlink 0.32s ease; }
  .balance-masked{ letter-spacing:2px; }
  .balance-strip{ margin-top:14px; }
  .balance-strip .label{ font-size:11px; color:#AEB8C6; margin:0; }
  .balance-strip .value{ font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; margin:2px 0 0 0;
    background:linear-gradient(90deg, #FFFFFF, #F2DFA0); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ---- content ---- */
  #content{ flex:1; padding:16px 14px 90px 14px; max-width:640px; width:100%; margin:0 auto; }
  .stack{ display:flex; flex-direction:column; gap:16px; }

  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .summary-card{ background:var(--paper-raised); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:12px; padding:13px; box-shadow:var(--shadow-sm); }
  .summary-icon{ width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .tone-ink{ border-left-color:var(--ink); background:linear-gradient(180deg, #FFFFFF, #F2F4F8); }
  .tone-ink .summary-icon{ background:#16233A1F; color:var(--ink); }
  .tone-green{ border-left-color:var(--ledger); background:linear-gradient(180deg, #FFFFFF, #EAF6EF); }
  .tone-green .summary-icon{ background:#1B433224; color:var(--ledger); }
  .tone-green .summary-value{ color:var(--ledger); }
  .tone-brick{ border-left-color:var(--brick); background:linear-gradient(180deg, #FFFFFF, #FBEDE9); }
  .tone-brick .summary-icon{ background:#B3432B1F; color:var(--brick); }
  .tone-brick .summary-value{ color:var(--brick); }
  .tone-gold{ border-left-color:var(--gold); background:linear-gradient(180deg, #FFFFFF, #FBF3DC); }
  .tone-gold .summary-icon{ background:#C9A2272E; color:#8A6D1A; }
  .summary-label{ margin:0 0 3px 0; font-size:11px; color:var(--muted); }
  .summary-value{ margin:0; font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; }

  .panel{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:16px;
    box-shadow:var(--shadow-sm); border-top:3px solid transparent;
    border-image:linear-gradient(90deg, var(--gold), var(--teal-light)) 1; }
  .panel h2{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; margin:0 0 12px 0; display:flex; align-items:center; gap:6px; }
  .panel h2 .muted{ font-size:11px; font-weight:400; margin-left:2px; }
  .chart-wrap{ position:relative; height:210px; }
  .muted{ color:var(--muted); }
  .small{ font-size:12px; }

  .reminder-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .reminder-row{ display:flex; align-items:flex-start; gap:8px; padding:11px 2px; border-bottom:1px dashed var(--line); flex-wrap:wrap; }
  .reminder-row:last-child{ border-bottom:none; }
  .reminder-row.select-mode{ cursor:pointer; align-items:center; }
  .reminder-row.selected{ background:#EAF6EF; border-radius:8px; }
  .reminder-desc{ margin:0; font-weight:500; font-size:13.5px; }
  .reminder-right{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .amount{ font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .amount.entrada{ color:var(--ledger); }
  .amount.saida{ color:var(--brick); }

  .stamp{ font-family:'Fraunces',serif; font-size:9px; font-weight:700; letter-spacing:0.5px; border:1.5px dashed;
    border-radius:20px; padding:2px 8px; text-transform:uppercase; transform:rotate(-2deg); white-space:nowrap; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .section-head h2{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0; }

  .filter-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .notif-status{ margin:-4px 0 4px 0; }
  .filters-panel{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:12px;
    display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm); }
  .chip{ border:1px solid var(--line); background:var(--paper-raised); border-radius:20px; padding:6px 13px;
    font-size:12px; color:var(--muted); }
  .chip.active{ background:linear-gradient(135deg, var(--ink), var(--ledger)); color:#fff; border-color:var(--ink); }
  .chip.chip-warn{ color:var(--brick); border-color:#E7C9BF; }
  .chip.chip-warn.active{ background:linear-gradient(135deg, var(--rose), var(--brick)); color:#fff; border-color:var(--brick); }

  .account-grid{ display:flex; flex-direction:column; gap:7px; }
  .accounts-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .accounts-stats > div{ background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:9px 8px; text-align:center; box-shadow:var(--shadow-sm); }
  .accounts-stats .stat-value{ margin:2px 0 0 0; font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; }
  .account-card{ background:var(--paper-raised); border:1.5px solid #C9C2AA; border-left:3px solid var(--teal-light);
    border-radius:10px; padding:9px 40px 9px 12px; position:relative; cursor:pointer; box-shadow:var(--shadow-sm); }
  .account-card.acc-tone-positive{ background:linear-gradient(180deg, #FFFFFF, #E3F1F3); }
  .account-card.acc-tone-negative{ background:linear-gradient(180deg, #FFFFFF, #FBEDE9); }
  .account-card.zebra-a{ background:var(--paper-raised); }
  .account-card.zebra-b{ background:#FBF7EC; }
  .account-card.inactive{ opacity:0.6; background:#F1EEE3; border-left-color:var(--line); }
  .inactive-tag{ color:var(--brick); font-weight:600; }
  .account-card h3{ font-family:'Fraunces',serif; font-size:13.5px; margin:1px 0 4px 0; }
  .type-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .account-card.select-mode{ cursor:pointer; }
  .account-card.selected{ background:#EAF6EF !important; border-left-color:var(--ledger) !important; box-shadow:0 0 0 1.5px var(--ledger); }
  .account-balance{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; margin:0; }
  .icon-btn{ background:none; border:none; padding:4px; border-radius:6px; color:var(--muted); }
  .account-card .icon-btn.danger{ position:absolute; top:6px; right:6px; }
  .account-card .icon-btn.edit-acct{ position:absolute; top:32px; right:6px; color:var(--muted); }
  .account-card .icon-btn.edit-acct:hover{ color:var(--ink); }
  .account-card .icon-btn.toggle-acct{ position:absolute; top:58px; right:6px; color:var(--muted); }
  .account-card .icon-btn.toggle-acct:hover{ color:var(--ledger); }

  .ledger{ list-style:none; margin:0; padding:0; }
  .ledger-row{ display:flex; align-items:center; gap:9px; padding:11px 2px; border-bottom:1px solid var(--line); }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-row.clickable{ cursor:pointer; }
  .ledger-row.clickable:active{ background:#F1EEE3; }
  .ledger-row.selected{ background:#EAF6EF; border-radius:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.entrada{ background:var(--ledger); }
  .dot.saida{ background:var(--brick); }
  .ledger-main{ flex:1; min-width:0; }
  .ledger-desc{ margin:0; font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .day-ledger{ display:flex; flex-direction:column; gap:10px; }
  .day-block{ border-radius:10px; padding:8px 10px; }
  .day-block.day-alt-0{ background:#EAF3FB; }
  .day-block.day-alt-1{ background:#EAF3FB; }
  .day-block .ledger-row{ border:1px solid rgba(22,35,58,0.16); border-radius:8px; padding:10px 8px; margin-bottom:6px; background:rgba(255,255,255,0.5); }
  .day-block .ledger-row:last-child{ margin-bottom:0; border:1px solid rgba(22,35,58,0.16); }
  .day-label{ margin:0 0 2px 0; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:0.3px; text-transform:uppercase; }
  .day-balance{ margin:6px 0 0 0; font-size:11.5px; color:var(--muted); text-align:right; padding-top:6px; border-top:1px dashed rgba(22,35,58,0.15); }
  .day-balance .amount{ font-size:12px; }

  .tx-groups{ display:flex; flex-direction:column; gap:8px; }
  .tx-group{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-sm); }
  .tx-group-header{ width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; padding:13px 14px; text-align:left; font-family:'Inter',sans-serif; }
  .chevron{ flex-shrink:0; color:var(--muted); transition:transform 0.15s ease; }
  .chevron.open{ transform:rotate(90deg); color:var(--ink); }
  .tx-group-title{ flex:1; min-width:0; }
  .tx-group-name{ margin:0; font-size:14px; font-weight:600; font-family:'Fraunces',serif; }
  .tx-group-body{ border-top:1px solid var(--line); padding:12px 14px 10px 14px; }
  .tx-group-body .ledger-row{ padding-left:2px; }

  .tx-layout{ display:flex; gap:10px; align-items:flex-start; }
  .tx-sidebar{ flex:0 0 148px; width:148px; display:flex; flex-direction:column; gap:4px;
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:12px; padding:8px; }
  .acct-chip{ background:none; border:1px solid var(--line); border-radius:8px; padding:9px 8px; font-size:12.5px; line-height:1.3;
    font-family:'Inter',sans-serif; color:var(--ink); text-align:left; word-break:break-word; }
  .acct-chip .acct-chip-balance{ display:block; margin-top:2px; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    font-weight:600; color:var(--muted); opacity:0.9; }
  .acct-chip.acc-tone-positive{ background:linear-gradient(180deg, #FFFFFF, #E3F1F3); border-color:#B9DCE2; }
  .acct-chip.acc-tone-negative{ background:linear-gradient(180deg, #FFFFFF, #FBEDE9); border-color:#EAC4BB; }
  .acct-chip.active .acct-chip-balance{ color:#fff; opacity:0.85; }
  .acct-chip.active{ background:linear-gradient(135deg, var(--ledger-light), var(--ledger)); color:#fff; font-weight:600; }
  .acct-chip.inactive{ color:var(--muted); opacity:0.75; }
  .acct-chip.inactive.active{ background:var(--muted); color:#fff; opacity:1; }
  .acct-chip-all{ font-weight:700; font-family:'Fraunces',serif; font-size:13px; border-bottom:1px solid var(--line); border-radius:0; padding-bottom:9px; margin-bottom:4px; }
  .acct-sidebar-divider{ border-top:1px dashed var(--line); margin:4px 0; padding-top:2px; }
  .tx-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }

  .period-row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .period-row select{ font-family:'Inter',sans-serif; font-size:12px; padding:7px 8px; border:1px solid var(--line);
    border-radius:8px; background:#FCFBF7; color:var(--ink); }

  .transfer-info{ display:flex; align-items:center; gap:12px; background:#F4EFDD; border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; }
  .transfer-info p{ margin:0; font-size:12.5px; flex:1; }
  .transfer-info svg{ color:#8A6D1A; flex-shrink:0; }

  .empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:5px; padding:30px 10px; color:var(--muted); }
  .empty-title{ margin:4px 0 0 0; font-weight:600; color:var(--ink); font-size:13.5px; }
  .empty-hint{ margin:0; font-size:12px; }

  /* ---- FAB ---- */
  .fab{ position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 76px); width:54px; height:54px;
    border-radius:50%; background:linear-gradient(135deg, var(--ledger-light), var(--ledger)); color:#fff; border:none; font-size:26px; line-height:1;
    box-shadow:0 6px 16px rgba(27,67,50,0.35); display:flex; align-items:center; justify-content:center; z-index:15; }
  .fab.hidden{ display:none; }

  /* ---- bottom nav ---- */
  .bottomnav{ position:fixed; bottom:0; left:0; right:0; background:var(--paper-raised); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 2px) 6px; gap:4px; z-index:20; }
  .nav-btn{ flex:1; background:none; border:none; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 2px; color:var(--muted); font-size:10.5px; font-family:'Inter',sans-serif; transition:background 0.15s ease, color 0.15s ease; }
  .nav-btn.active{ color:var(--ledger); background:#1B433216; font-weight:600; }
  .nav-btn svg{ width:20px; height:20px; }

  /* ---- modal / bottom sheet ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(22,35,58,0.45); z-index:30; display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-sheet{ background:var(--paper); width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
    padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 22px) 18px; transform:translateY(100%); transition:transform 0.25s ease; }
  .modal-overlay.open .modal-sheet{ transform:translateY(0); }
  .modal-sheet.sheet-compact{ max-height:min(78vh, 560px); }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:4px; margin:8px auto 14px auto; }
  .sheet-title{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin:0 0 14px 0; display:flex; align-items:center; justify-content:space-between; }

  .field{ display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); font-weight:500; margin-bottom:12px; }
  .field input, .field select{ font-family:'Inter',sans-serif; font-size:15px; padding:11px 12px; border:1px solid var(--line);
    border-radius:9px; background:#FCFBF7; color:var(--ink); width:100%; }
  .field input:focus, .field select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:14px; }

  .compact-form .field{ margin-bottom:9px; }
  .compact-form .field input, .compact-form .field select{ padding:9px 10px; font-size:14px; }
  .compact-form .checkbox-row{ margin-bottom:10px; }
  .compact-form .segmented{ margin-bottom:9px; }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; min-width:0; }
  .field-row > button{ flex:1; text-align:center; }

  .stmt-filters{ display:flex; gap:8px; margin-bottom:16px; }
  .stmt-filters select{ flex:1; font-family:'Inter',sans-serif; font-size:14px; padding:10px 11px; border:1px solid var(--line);
    border-radius:9px; background:#FCFBF7; color:var(--ink); }
  .stmt-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .stmt-summary > div{ background:#FCFBF7; border:1px solid var(--line); border-radius:9px; padding:9px 8px; text-align:center; }
  .stmt-summary > div:nth-child(1){ background:#EAF6EF; }
  .stmt-summary > div:nth-child(2){ background:#FBEDE9; }
  .stmt-summary > div:nth-child(3){ background:#F2F4F8; }
  .stmt-summary .amount{ font-size:12.5px; display:block; margin-top:2px; }

  .sheet-divider{ border-top:1px solid var(--line); margin:20px 0 16px 0; }
  .changelog-list{ display:flex; flex-direction:column; gap:14px; max-height:260px; overflow-y:auto; }
  .changelog-entry{ border-left:2px solid var(--line); padding-left:12px; }
  .changelog-version{ margin:0 0 4px 0; font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; color:var(--ledger); }
  .changelog-entry ul{ margin:0; padding-left:16px; }
  .changelog-entry li{ font-size:12.5px; color:var(--ink); margin-bottom:3px; line-height:1.4; }

  .segmented{ display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:12px; }
  .segmented button{ flex:1; padding:11px 0; background:#FCFBF7; border:none; font-size:14px; font-family:'Inter',sans-serif; }
  .segmented button.active{ background:var(--ledger); color:#fff; font-weight:600; }
  .segmented-3 button{ font-size:12.5px; padding:11px 2px; }
  .hidden-field{ display:none; }

  .consolidado-toggle{ width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); background:none;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0; color:#fff; }

    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; }
  .select-check.on{ background:linear-gradient(135deg, var(--ledger-light), var(--ledger)); border-color:var(--ledger); }
  .account-card .select-check{ position:absolute; top:9px; right:9px; }

  .selection-bar{ display:flex; flex-direction:column; gap:8px; background:#FBF3DC;
    border:1px solid var(--gold); border-radius:10px; padding:9px 12px; }
  .selection-bar-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .selection-bar .btn-ghost[disabled]{ opacity:0.45; }
  .selection-bar .btn-ghost.small{ padding:5px 10px; font-size:11.5px; }
  .selection-bar .btn-ghost svg{ vertical-align:-2px; margin-right:2px; width:13px; height:13px; }

  .btn-primary{ background:linear-gradient(135deg, var(--ledger-light), var(--ledger)); color:#fff; border:none; border-radius:9px; padding:13px 18px; font-size:14.5px;
    font-weight:600; width:100%; font-family:'Inter',sans-serif; margin-top:4px; box-shadow:0 3px 10px rgba(27,67,50,0.25); }
  .btn-ghost{ background:none; border:1px solid var(--line); border-radius:9px; padding:8px 13px; font-size:12.5px;
    color:var(--ink); font-family:'Inter',sans-serif; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .btn-ghost.small{ padding:6px 10px; font-size:11.5px; }
  .btn-ghost svg{ flex-shrink:0; width:13px; height:13px; }

  @media (min-width:680px){
    .cards{ grid-template-columns:repeat(4,1fr); }
    #content{ max-width:900px; }
    .tx-sidebar{ flex-basis:180px; width:180px; }
    .account-grid{ display:grid; grid-template-columns:1fr 1fr; align-items:start; }
    .period-row{ flex-wrap:nowrap; }
  }
  @media (max-width:360px){
    .tx-sidebar{ flex-basis:120px; width:120px; }
    .acct-chip{ font-size:11px; padding:8px 6px; }
  }

  /* ---- loading screen: moedas caindo ---- */
  .loading-screen{ position:fixed; inset:0; z-index:9999; background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; transition:opacity 0.45s ease, visibility 0.45s ease; }
  .loading-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .loading-coins{ position:relative; width:100%; max-width:260px; height:170px; }
  .coin{ position:absolute; top:-30px; width:24px; height:24px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--amber), var(--gold) 60%, #93720F 100%);
    box-shadow:0 3px 6px rgba(22,35,58,0.25), inset 0 0 0 2px rgba(255,255,255,0.35);
    animation:coin-fall 1.7s cubic-bezier(.5,0,.85,.4) infinite; }
  .coin::after{ content:'R$'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:7.5px; font-weight:700; color:#5C4A12; }
  @keyframes coin-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    12%{ opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateY(168px) rotate(300deg); opacity:0; }
  }
  .coin.c1{ left:4%;  animation-delay:0s; }
  .coin.c2{ left:18%; animation-delay:0.55s; }
  .coin.c3{ left:32%; animation-delay:0.2s; }
  .coin.c4{ left:47%; animation-delay:0.75s; }
  .coin.c5{ left:61%; animation-delay:0.35s; }
  .coin.c6{ left:75%; animation-delay:0.9s; }
  .coin.c7{ left:89%; animation-delay:0.1s; }
  .coin.c8{ left:55%; animation-delay:1.1s; }
  .loading-mark{ font-family:'Fraunces',serif; font-weight:700; font-size:19px; color:var(--ink); margin:2px 0 2px 0; }
  .loading-text{ font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); margin:0; }
  @media (prefers-reduced-motion: reduce){
    .coin{ animation:none; opacity:0.5; top:60px; }
  }
</style>
</head>

/* =========================== state & storage (IndexedDB) =========================== */
// IndexedDB é usado em vez de localStorage porque suporta bases de dados
// bem maiores (o localStorage tem limite de ~5MB em vários navegadores).
const DB_NAME = 'livrocaixa_db', DB_STORE = 'kv';
let accounts = [], transactions = [], bills = [];
let activeTab = 'dashboard';
let filterTipo = 'todos';
let filterConsolidado = 'todos';
let acctSelectMode = false, selectedAccounts = new Set(), lastAccountsListIds = [];
let txSelectMode = false, selectedTx = new Set(), lastTxFilteredIds = [];
let longPressTimer = null, longPressTriggered = false;
let billSelectMode = false, selectedBills = new Set(), lastBillsListIds = [];
let filterBills = 'pendentes';
let expandedGroups = new Set();
let groupVisible = {};
let txFilterAccountId = null;
let txPeriod = { mode: 'recent' };
let stmtAccountId = null;
let stmtMonth = null;
let stmtYear = null;
let barChart = null, pieChart = null;
let pieChartPeriod = null; // { month, year } — definido no primeiro render com o mês/ano atuais
let dbPromise = null;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => { e.target.result.createObjectStore(DB_STORE, { keyPath: 'key' }); };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e);
  });
  return dbPromise;
}
function idbGetAll(){
  return openDB().then((db) => new Promise((resolve, reject) => {
    const store = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE);
    const out = {};
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor) { out[cursor.value.key] = cursor.value.value; cursor.continue(); }
      else resolve(out);
    };
    req.onerror = (e) => reject(e);
  }));
}
function idbSet(key, value){
  return openDB().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put({ key, value });
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  }));
}

function persist(){
  idbSet('accounts', accounts).catch(() => {});
  idbSet('transactions', transactions).catch(() => {});
  idbSet('bills', bills).catch(() => {});
  syncAlarmsWithKodular();
}

function migrateData(){
  const today = todayStr();
  accounts.forEach(a => { if (a.ativo === undefined) a.ativo = true; });
  transactions.forEach(t => { if (t.consolidado === undefined) t.consolidado = t.data <= today; });
}

async function loadInitialState(){
  try{
    const stored = await idbGetAll();
    if (stored.accounts || stored.transactions || stored.bills) {
      accounts = stored.accounts || [];
      transactions = stored.transactions || [];
      bills = stored.bills || [];
      migrateData();
      return;
    }
    // migração única: se havia dados salvos na versão anterior (localStorage), traz para o IndexedDB
    const oldA = localStorage.getItem('lc_accounts');
    const oldT = localStorage.getItem('lc_transactions');
    const oldB = localStorage.getItem('lc_bills');
    if (oldA || oldT || oldB) {
      accounts = oldA ? JSON.parse(oldA) : [];
      transactions = oldT ? JSON.parse(oldT) : [];
      bills = oldB ? JSON.parse(oldB) : [];
      migrateData();
      persist();
    }
  } catch(err){
    console.error('Erro ao carregar dados salvos:', err);
  }
}

/* =========================== Firebase: sincronização multiusuário =========================== */
// Cada dispositivo guarda sua própria cópia local (IndexedDB) para funcionar offline.
// Quando configurado, o Firebase Firestore sincroniza contas, transações e contas a pagar
// em tempo real entre todos os aparelhos conectados ao mesmo projeto.
let fbApp = null, fbDb = null, fbReady = false, fbSyncing = false, fbConnecting = false, fbError = false;
let fbUnsubscribers = [];
let fbFirstSnapshot = { accounts:false, bills:false, transactions:false };
function fbAllFirstSnapshotsIn(){ return fbFirstSnapshot.accounts && fbFirstSnapshot.bills && fbFirstSnapshot.transactions; }

// A sincronização com a nuvem NÃO é mais automática/contínua. Ela só acontece:
// (1) uma vez por dia, a partir das 7h, sozinha; ou (2) quando a pessoa toca no botão
// de sincronizar. Enquanto isso, exclusões E alterações feitas localmente ficam
// guardadas aqui até a próxima sincronização — que só envia essas mudanças, não tudo
// de novo, pra não recarregar milhares de registros sem necessidade.
let lastCloudSyncAt = null;
let pendingDeletes = { accounts: [], bills: [], transactions: [] };
let pendingUpserts = { accounts: [], bills: [], transactions: [] };
async function loadSyncState(){
  try {
    const stored = await idbGetAll();
    lastCloudSyncAt = stored.lastCloudSyncAt || null;
    pendingDeletes = stored.pendingDeletes || { accounts: [], bills: [], transactions: [] };
    pendingUpserts = stored.pendingUpserts || { accounts: [], bills: [], transactions: [] };
  } catch(e){}
}
async function savePendingDeletes(){ try { await idbSet('pendingDeletes', pendingDeletes); } catch(e){} }
async function savePendingUpserts(){ try { await idbSet('pendingUpserts', pendingUpserts); } catch(e){} }
function queueDelete(collectionName, id){
  if(!pendingDeletes[collectionName]) pendingDeletes[collectionName] = [];
  if(!pendingDeletes[collectionName].includes(id)) pendingDeletes[collectionName].push(id);
  savePendingDeletes();
}
function queueDeletes(collectionName, ids){
  if(!pendingDeletes[collectionName]) pendingDeletes[collectionName] = [];
  ids.forEach(id => { if(!pendingDeletes[collectionName].includes(id)) pendingDeletes[collectionName].push(id); });
  savePendingDeletes();
}
function unqueueDeletes(collectionName, ids){
  if(!pendingDeletes[collectionName]) return;
  pendingDeletes[collectionName] = pendingDeletes[collectionName].filter(id => !ids.includes(id));
  savePendingDeletes();
}
function queueUpsert(collectionName, id){
  if(!pendingUpserts[collectionName]) pendingUpserts[collectionName] = [];
  if(!pendingUpserts[collectionName].includes(id)) pendingUpserts[collectionName].push(id);
  savePendingUpserts();
}
function queueUpserts(collectionName, ids){
  if(!pendingUpserts[collectionName]) pendingUpserts[collectionName] = [];
  ids.forEach(id => { if(!pendingUpserts[collectionName].includes(id)) pendingUpserts[collectionName].push(id); });
  savePendingUpserts();
}
function unqueueUpserts(collectionName, ids){
  if(!pendingUpserts[collectionName]) return;
  pendingUpserts[collectionName] = pendingUpserts[collectionName].filter(id => !ids.includes(id));
  savePendingUpserts();
}

async function loadFirebaseConfig(){
  try { const stored = await idbGetAll(); return stored.firebaseConfig || null; }
  catch(e){ return null; }
}
async function saveFirebaseConfig(configObj){ await idbSet('firebaseConfig', configObj); }
async function clearFirebaseConfig(){ await idbSet('firebaseConfig', null); }

function formatRelativeSync(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if(sameDay) return `hoje às ${hh}:${mm}`;
  const y = new Date(now); y.setDate(y.getDate()-1);
  if(d.toDateString() === y.toDateString()) return `ontem às ${hh}:${mm}`;
  return `em ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} às ${hh}:${mm}`;
}

function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(fbSyncing) el.textContent = '☁ Sincronizando...';
  else if(fbError) el.textContent = '⚠ Erro de sincronização';
  else if(lastCloudSyncAt) el.textContent = '☁ Sincronizado ' + formatRelativeSync(lastCloudSyncAt);
  else el.textContent = '☁ Ainda não sincronizado';
}

let fbInitPromise = null;
// Nunca deixa uma promessa pendurada pra sempre — usado para blindar chamadas de rede
// (ex: login no Firebase) que às vezes nunca resolvem nem rejeitam com conexão ruim.
function withTimeout(promise, ms, timeoutMsg){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(timeoutMsg || 'timeout')), ms)),
  ]);
}

async function initFirebase(){
  fbUnsubscribers.forEach(u => { try{ u(); }catch(e){} });
  fbUnsubscribers = [];
  fbReady = false;
  fbError = false;
  fbFirstSnapshot = { accounts:false, bills:false, transactions:false };
  fbInitPromise = (async () => {
    const config = await loadFirebaseConfig();
    if(!config || !config.apiKey || typeof firebase === 'undefined'){ updateSyncBadge(); return; }
    fbConnecting = true;
    updateSyncBadge();
    try{
      fbApp = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(config);
      fbDb = firebase.firestore();
      // Dentro de WebViews como a do Kodular, o transporte de rede padrão do Firestore
      // (streaming) às vezes falha de forma silenciosa — a operação nem dá erro nem
      // termina, fica pendurada pra sempre. Forçar "long polling" evita isso.
      try { fbDb.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch(e){}
      await withTimeout(firebase.auth().signInAnonymously(), 15000, 'timeout no login anônimo');
      fbReady = true;
      fbConnecting = false;
      // Não liga os listeners em tempo real aqui — a sincronização agora acontece só
      // sob demanda, dentro de performCloudSync(), que liga e desliga os listeners
      // apenas durante a própria sincronização.
      updateSyncBadge();
    } catch(e){
      console.warn('Falha ao iniciar Firebase:', e);
      fbReady = false;
      fbConnecting = false;
      fbError = true;
      updateSyncBadge();
    }
  })();
  await fbInitPromise;
}

// Toda operação de escrita passa por aqui primeiro: se uma conexão está em andamento
// (ex: acabou de abrir o app), espera ela terminar antes de decidir se envia ou não.
// Isso evita perder alterações feitas nos primeiros segundos após abrir o app.
async function ensureFbSettled(){
  if(fbInitPromise) { try { await fbInitPromise; } catch(e){} }
}

// Processa as mudanças vindas do Firestore. Importante: usa um mapa (id -> índice) em
// vez de "findIndex" por item — com milhares de registros (ex: 17 mil transações), fazer
// uma varredura completa por item, dentro de um laço, virava uma conta gigantesca e
// travava o app por muito tempo toda vez que a sincronização buscava dados da nuvem.
function applyDocChanges(collectionKey, arrRef, changes){
  let changed = false;
  const idIndex = new Map();
  arrRef.forEach((item, idx) => idIndex.set(item.id, idx));
  const removedIds = new Set();
  changes.forEach(change => {
    const data = change.doc.data();
    if(change.type === 'removed'){
      removedIds.add(data.id);
      changed = true;
    } else {
      const idx = idIndex.get(data.id);
      if(idx !== undefined) arrRef[idx] = data;
      else { arrRef.push(data); idIndex.set(data.id, arrRef.length - 1); }
      changed = true;
    }
  });
  if(removedIds.size){
    for(let i = arrRef.length - 1; i >= 0; i--){ if(removedIds.has(arrRef[i].id)) arrRef.splice(i, 1); }
  }
  return changed;
}

function attachFirestoreListeners(){
  if(!fbReady) return;
  fbUnsubscribers.push(fbDb.collection('accounts').onSnapshot((snap) => {
    fbError = false; updateSyncBadge();
    fbFirstSnapshot.accounts = true;
    if(applyDocChanges('accounts', accounts, snap.docChanges())){ migrateData(); persist(); render(); }
  }, (err) => { console.warn('accounts listener error', err); fbError = true; fbFirstSnapshot.accounts = true; updateSyncBadge(); }));

  fbUnsubscribers.push(fbDb.collection('bills').onSnapshot((snap) => {
    fbFirstSnapshot.bills = true;
    if(applyDocChanges('bills', bills, snap.docChanges())){ persist(); render(); }
  }, (err) => { console.warn('bills listener error', err); fbError = true; fbFirstSnapshot.bills = true; updateSyncBadge(); }));

  fbUnsubscribers.push(fbDb.collection('transactions').onSnapshot((snap) => {
    fbFirstSnapshot.transactions = true;
    if(applyDocChanges('transactions', transactions, snap.docChanges())){ migrateData(); persist(); render(); }
  }, (err) => { console.warn('transactions listener error', err); fbError = true; fbFirstSnapshot.transactions = true; updateSyncBadge(); }));
}

async function fsSetDoc(collectionName, doc){
  queueUpsert(collectionName, doc.id);
  await ensureFbSettled();
  if(!fbReady) return;
  try { await withTimeout(fbDb.collection(collectionName).doc(doc.id).set(doc), 20000, 'timeout ao salvar'); unqueueUpserts(collectionName, [doc.id]); }
  catch(e){ console.warn(`Firestore: falha ao salvar em ${collectionName}`, e); fbError = true; updateSyncBadge(); }
}
async function fsDeleteDoc(collectionName, id){
  queueDelete(collectionName, id);
  unqueueUpserts(collectionName, [id]);
  await ensureFbSettled();
  if(!fbReady) return;
  try { await withTimeout(fbDb.collection(collectionName).doc(id).delete(), 20000, 'timeout ao excluir'); unqueueDeletes(collectionName, [id]); }
  catch(e){ console.warn(`Firestore: falha ao excluir em ${collectionName}`, e); fbError = true; updateSyncBadge(); }
}
// Processa vários lotes de uma vez (em paralelo, com um limite), em vez de esperar um
// terminar pra começar o próximo. Com "long polling" (necessário dentro do WebViewer do
// Kodular pra não travar), cada lote sozinho é mais lento — rodar vários ao mesmo tempo
// é o que compensa essa lentidão e acelera o envio de muitos registros de uma vez.
async function runChunksConcurrently(chunks, worker, concurrency){
  let ok = 0, fail = 0, doneCount = 0, nextIdx = 0;
  const total = chunks.reduce((s,c) => s + c.length, 0);
  async function runOne(){
    while(nextIdx < chunks.length){
      const idx = nextIdx++;
      const r = await worker(chunks[idx]);
      if(r.ok) ok += chunks[idx].length; else fail += chunks[idx].length;
      doneCount += chunks[idx].length;
      if(worker.onChunk) worker.onChunk(doneCount, total);
    }
  }
  await Promise.all(Array.from({ length: Math.min(concurrency, chunks.length) }, runOne));
  return { ok, fail };
}

async function fsBatchSet(collectionName, docs, onChunk){
  queueUpserts(collectionName, docs.map(d => d.id));
  await ensureFbSettled();
  if(!fbReady || !docs.length) return { ok: 0, fail: 0 };
  const CHUNK = 400;
  const chunks = [];
  for(let i = 0; i < docs.length; i += CHUNK) chunks.push(docs.slice(i, i + CHUNK));
  const worker = async (chunk) => {
    const batch = fbDb.batch();
    chunk.forEach(d => batch.set(fbDb.collection(collectionName).doc(d.id), d));
    try { await withTimeout(batch.commit(), 30000, 'timeout no envio em lote'); unqueueUpserts(collectionName, chunk.map(d => d.id)); return { ok: true }; }
    catch(e){ console.warn('Firestore: falha no envio em lote', e); fbError = true; return { ok: false }; }
  };
  worker.onChunk = onChunk;
  const result = await runChunksConcurrently(chunks, worker, 4);
  updateSyncBadge();
  return result;
}
async function fsBatchDelete(collectionName, ids){
  queueDeletes(collectionName, ids);
  unqueueUpserts(collectionName, ids);
  await ensureFbSettled();
  if(!fbReady || !ids.length) return;
  const CHUNK = 400;
  const chunks = [];
  for(let i = 0; i < ids.length; i += CHUNK) chunks.push(ids.slice(i, i + CHUNK));
  const worker = async (chunk) => {
    const batch = fbDb.batch();
    chunk.forEach(id => batch.delete(fbDb.collection(collectionName).doc(id)));
    try { await withTimeout(batch.commit(), 30000, 'timeout na exclusão em lote'); unqueueDeletes(collectionName, chunk); return { ok: true }; }
    catch(e){ console.warn('Firestore: falha na exclusão em lote', e); fbError = true; updateSyncBadge(); return { ok: false }; }
  };
  await runChunksConcurrently(chunks, worker, 4);
}
async function fsCollectionCount(collectionName){
  await ensureFbSettled();
  if(!fbReady) return null;
  try {
    if(fbDb.collection(collectionName).count){
      const snap = await withTimeout(fbDb.collection(collectionName).count().get(), 20000, 'timeout ao contar');
      return snap.data().count;
    }
    const snap = await withTimeout(fbDb.collection(collectionName).get(), 20000, 'timeout ao contar');
    return snap.size;
  } catch(e){ console.warn('Firestore: falha ao contar', e); return null; }
}

let fbWakeLock = null;
async function requestWakeLockSafe(){
  try { if('wakeLock' in navigator) fbWakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){ /* best-effort, ignora se não suportado */ }
}
function releaseWakeLockSafe(){
  try { if(fbWakeLock){ fbWakeLock.release(); fbWakeLock = null; } } catch(e){}
}

// Envia só o que mudou desde a última sincronização (registros nas filas de
// pendingUpserts/pendingDeletes), em vez de reenviar tudo. Muito mais rápido quando
// há muitos registros. É o que a sincronização de rotina usa; syncAllToFirebase()
// (reenvio completo) fica reservado pra primeira conexão ou pra um pedido explícito.
async function pushLocalChanges(onProgress){
  if(!fbReady) return false;
  fbSyncing = true;
  await requestWakeLockSafe();
  try{
    const collections = { accounts, bills, transactions };
    let totalFail = 0, totalSent = 0;
    for(const col of ['accounts','bills','transactions']){
      const ids = (pendingUpserts[col] || []).slice();
      if(!ids.length) continue;
      const byId = new Map(collections[col].map(d => [d.id, d]));
      const docs = ids.map(id => byId.get(id)).filter(Boolean);
      const missing = ids.filter(id => !byId.has(id));
      if(missing.length) unqueueUpserts(col, missing); // id não existe mais localmente (ex: criado e já excluído antes de sincronizar)
      if(!docs.length) continue;
      if(onProgress) onProgress(`Enviando ${docs.length} alteração(ões) (${col})…`);
      const r = await fsBatchSet(col, docs, (done, total) => {
        if(onProgress) onProgress(`Enviando ${col}: ${done}/${total}…`);
      });
      totalFail += r.fail;
      totalSent += r.ok;
    }
    if(onProgress){
      onProgress(totalFail > 0
        ? `⚠ Envio incompleto: ${totalFail} registro(s) falharam. Sincronize novamente para tentar de novo.`
        : totalSent > 0 ? `✓ ${totalSent} alteração(ões) enviada(s).` : '✓ Nada novo para enviar.');
    }
  } finally {
    fbSyncing = false;
    releaseWakeLockSafe();
  }
  return true;
}

async function syncAllToFirebase(onProgress){
  if(!fbReady) return false;
  fbSyncing = true;
  await requestWakeLockSafe();
  try{
    if(onProgress) onProgress('Enviando contas...');
    const rAcc = await fsBatchSet('accounts', accounts);

    if(onProgress) onProgress('Enviando contas a pagar...');
    const rBills = await fsBatchSet('bills', bills);

    if(onProgress) onProgress(`Enviando 0/${transactions.length} transações... mantenha o app aberto e a tela ligada.`);
    const rTx = await fsBatchSet('transactions', transactions, (done, total) => {
      if(onProgress) onProgress(`Enviando ${done}/${total} transações... mantenha o app aberto e a tela ligada.`);
    });

    if(onProgress) onProgress('Conferindo dados na nuvem...');
    const cloudCount = await fsCollectionCount('transactions');

    const totalFail = rAcc.fail + rBills.fail + rTx.fail;
    if(totalFail > 0){
      if(onProgress) onProgress(`⚠ Envio incompleto: ${totalFail} registro(s) falharam. Toque em "Enviar" novamente para tentar de novo.`);
    } else if(cloudCount !== null && cloudCount < transactions.length){
      if(onProgress) onProgress(`⚠ Só ${cloudCount} de ${transactions.length} transações confirmadas na nuvem. Toque em "Enviar" novamente.`);
    } else {
      if(onProgress) onProgress(`✓ Sincronização concluída: ${accounts.length} contas, ${transactions.length} transações, ${bills.length} contas a pagar.`);
    }
  } finally {
    fbSyncing = false;
    releaseWakeLockSafe();
  }
  return true;
}

// Sincronização completa sob demanda: conecta, envia exclusões pendentes, envia o
// estado local atual (upsert) e por fim busca dados da nuvem (ex: lançados em outro
// aparelho) — tudo isso uma única vez, sem deixar conexão em tempo real ligada depois.
// Chamada (1) automaticamente uma vez por dia a partir das 7h, ou (2) manualmente pelo
// botão de sincronizar no topo do app.
async function performCloudSync(manual){
  if(fbSyncing) return;
  const config = await loadFirebaseConfig();
  if(!config || !config.apiKey){
    if(manual) alert('Nenhuma conta de nuvem configurada. Toque em "Importar / exportar dados" para configurar a sincronização primeiro.');
    return;
  }
  fbSyncing = true;
  updateSyncBadge();
  if(manual) showLoadingScreen('Conectando à nuvem…');
  try{
    await withTimeout((async () => {
      // Se já está conectado (ex: sincronizou antes nesta mesma sessão), não reconecta
      // do zero — reaproveita a conexão já ativa. Reconectar do zero é o que fazia cada
      // sincronização baixar a coleção inteira de novo, mesmo sem nada nunca ter mudado.
      if(!fbReady) await initFirebase();
      if(!fbReady){
        if(manual) alert('Não foi possível conectar à nuvem agora. Tente novamente mais tarde.');
        return;
      }

      // 1) envia exclusões feitas localmente desde a última sincronização
      for(const col of ['accounts','bills','transactions']){
        const ids = (pendingDeletes[col] || []).slice();
        if(ids.length){
          if(manual) showLoadingScreen(`Enviando exclusões (${col})…`);
          await fsBatchDelete(col, ids);
        }
      }

      // 2) envia o que mudou desde a última sincronização (ou tudo, se for a primeira vez)
      fbSyncing = true; // pushLocalChanges/syncAllToFirebase mexem nessa flag também; garante que continue true até o fim
      const onProg = manual ? (msg) => { if(msg) showLoadingScreen(msg); } : null;
      if(!lastCloudSyncAt){
        await syncAllToFirebase(onProg);
      } else {
        await pushLocalChanges(onProg);
      }

      // 3) busca dados da nuvem (ex: lançamentos feitos em outro aparelho) — só precisa
      // de um snapshot completo na PRIMEIRA vez desta sessão. Depois disso, os listeners
      // continuam ativos sozinhos recebendo só as diferenças em segundo plano — por isso
      // NÃO desligamos mais eles no final. Isso é o que faz a 2ª sincronização em diante
      // (dentro da mesma vez que o app está aberto) ser rápida de novo.
      if(fbUnsubscribers.length === 0){
        if(manual) showLoadingScreen('Buscando dados novos da nuvem…');
        attachFirestoreListeners();
        await waitCloudFirstSync(MAX_CLOUD_SYNC_WAIT_MS);
      }

      lastCloudSyncAt = Date.now();
      try { await idbSet('lastCloudSyncAt', lastCloudSyncAt); } catch(e){}
      persist();
      render();
      if(manual) alert('Sincronização concluída!');
    })(), 5 * 60 * 1000, 'timeout na sincronização');
  } catch(e){
    console.warn('Sincronização não concluída:', e);
    fbError = true;
    if(manual) alert('A sincronização não foi concluída (' + (e && e.message === 'timeout na sincronização' ? 'demorou demais e foi cancelada' : 'erro de conexão') + '). Tente novamente.');
  } finally {
    fbSyncing = false;
    fbConnecting = false;
    updateSyncBadge();
    if(manual) hideLoadingScreen();
  }
}

// Dispara a sincronização diária sozinha, uma vez por dia, a partir das 7h — nunca antes.
async function maybeAutoSyncDaily(){
  const config = await loadFirebaseConfig();
  if(!config || !config.apiKey) return;
  const now = new Date();
  if(now.getHours() < 7) return;
  const alreadyToday = lastCloudSyncAt && new Date(lastCloudSyncAt).toDateString() === now.toDateString();
  if(alreadyToday) return;
  await performCloudSync(false);
}

/* =========================== notificações de vencimento =========================== */
// Aviso: funciona de forma confiável enquanto o app está aberto (em primeiro ou segundo
// plano) neste aparelho. Navegadores móveis (principalmente iPhone) não garantem acordar
// o app sozinho quando ele está totalmente fechado para disparar notificações no horário
// exato — nesse caso, abrir o app brevemente já dispara os avisos pendentes.
let notifiedSlots = {};
const BILL_REMINDER_SLOTS_DIA_ANTES = [11, 15];
const BILL_REMINDER_SLOTS_VENCIMENTO = [10, 12, 14, 16, 18, 20, 22];

// ===== MODO DE TESTE TEMPORÁRIO =====
// Enquanto true, a ponte de alarmes nativos (Kodular) ignora os horários fixos
// acima e gera um aviso a cada 5 minutos ao longo do dia, só pra testar se o
// alarme sobrevive às sincronizações automáticas sem ser cancelado à toa.
// IMPORTANTE: voltar para "false" depois do teste!
const DEBUG_TEST_5MIN = false;
function getVencimentoSlotMinutes(){
  if(DEBUG_TEST_5MIN){
    const arr = [];
    for(let m = 0; m < 24 * 60; m += 5) arr.push(m);
    return arr;
  }
  return BILL_REMINDER_SLOTS_VENCIMENTO.map(h => h * 60);
}

async function loadNotifiedSlots(){
  try { const stored = await idbGetAll(); notifiedSlots = stored.notifiedSlots || {}; }
  catch(e){ notifiedSlots = {}; }
}
async function saveNotifiedSlots(){
  try { await idbSet('notifiedSlots', notifiedSlots); } catch(e){}
}
function notificationsSupported(){ return typeof Notification !== 'undefined'; }
function notificationsGranted(){ return notificationsSupported() && Notification.permission === 'granted'; }

async function requestNotificationPermission(){
  if(!notificationsSupported()) return 'unsupported';
  try { return await Notification.requestPermission(); }
  catch(e){ return 'denied'; }
}

async function fireBillNotification(bill, days){
  const title = days === 1 ? 'Conta vence amanhã' : 'Conta vence hoje';
  const body = `${bill.descricao} — ${fmtBRL(bill.valor)}`;
  const opts = { body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: `bill-${bill.id}-${todayStr()}`, renotify: true, vibrate: [200,100,200] };
  try {
    if('serviceWorker' in navigator){
      // navigator.serviceWorker.ready espera até existir um service worker ATIVO — no Android,
      // usar o construtor "new Notification()" direto costuma ser bloqueado (é preciso passar
      // pelo service worker), então isso é essencial para as notificações aparecerem.
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, opts);
      return;
    }
    if(typeof Notification !== 'undefined') new Notification(title, opts);
  } catch(e){ console.warn('Falha ao mostrar notificação', e); }
}

function checkBillReminders(){
  if(!notificationsGranted()) return;
  const now = new Date();
  const hour = now.getHours();
  const todayKey = todayStr();
  let changed = false;
  bills.forEach(bill => {
    if(bill.pago) return;
    const dias = daysUntil(bill.vencimento);
    let slots = [];
    if(dias === 1) slots = BILL_REMINDER_SLOTS_DIA_ANTES;
    else if(dias === 0) slots = BILL_REMINDER_SLOTS_VENCIMENTO;
    else return;
    slots.forEach(slotHour => {
      if(hour === slotHour){
        const key = `${bill.id}|${todayKey}|${slotHour}`;
        if(!notifiedSlots[key]){
          fireBillNotification(bill, dias);
          notifiedSlots[key] = true;
          changed = true;
        }
      }
    });
  });
  if(changed) saveNotifiedSlots();
}

/* =========================== ponte de alarmes nativos (app Kodular) ===========================
   Quando o app roda dentro do WebViewer do Kodular (window.Kodular existe), a API web de
   Notification não funciona. Em vez de disparar notificações daqui, mandamos para o Kodular
   uma lista do que precisa ser agendado (via AlarmExtension) e do que precisa ser cancelado.
   O Kodular lê isso no evento WebViewStringChanged e usa os blocos ScheduleOnceInMinutes /
   CancelAlarm. Cada slot de aviso vira um id numérico estável (hash), para poder ser
   reagendado (sobrescrito) ou cancelado sem duplicar. */
function runningInsideKodular(){ return typeof window.Kodular !== 'undefined'; }

function stableIntHash(str){
  let h = 0;
  for(let i = 0; i < str.length; i++){ h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
  return Math.abs(h) || 1;
}

function sanitizeForBridge(txt){
  return String(txt).replace(/[~;|]/g, ' ');
}

async function syncAlarmsWithKodular(){
  if(!runningInsideKodular()) return;
  const now = Date.now();
  const desired = {};      // id -> {title, body, minutes} — só os que ainda estão no futuro (serão (re)agendados)
  const relevantIds = new Set(); // TODOS os ids de slots de itens pendentes, passados ou futuros —
                                  // usado só para decidir o que NÃO cancelar. Um slot cujo horário já passou
                                  // continua "relevante" (o alarme pode estar prestes a disparar, atrasado
                                  // pelo próprio Android) até o item ser pago/consolidado ou excluído.

  // Usa a MESMA lista unificada que a Visão Geral usa pro card "Contas pendentes":
  // contas a pagar (bills) + transações ainda não consolidadas. Antes essa função olhava
  // só "bills", e por isso nunca agendava nada pra quem usa a aba Transações em vez da
  // aba Contas.
  pendingItemsUnified().forEach(item => {
    const [y, m, d] = item.dueDate.split('-').map(Number);
    const diaAntes = new Date(y, m - 1, d - 1);
    const diaVenc = new Date(y, m - 1, d);
    const body = sanitizeForBridge(`${item.descricao} — ${fmtBRL(item.valor)}`);
    const itemKey = `${item.source}|${item.id}`;

    BILL_REMINDER_SLOTS_DIA_ANTES.forEach(h => {
      const target = new Date(diaAntes); target.setHours(h, 0, 0, 0);
      const id = stableIntHash(`${itemKey}|antes|${h}`);
      relevantIds.add(id);
      const ms = target.getTime() - now;
      if(ms > 0){
        desired[id] = { title: 'Vence amanhã', body, minutes: Math.ceil(ms / 60000) };
      }
    });
    getVencimentoSlotMinutes().forEach(minOfDay => {
      const target = new Date(diaVenc); target.setHours(0, 0, 0, 0); target.setMinutes(minOfDay);
      const id = stableIntHash(`${itemKey}|dia|${minOfDay}`);
      relevantIds.add(id);
      const ms = target.getTime() - now;
      if(ms > 0){
        desired[id] = { title: 'Vence hoje', body, minutes: Math.ceil(ms / 60000) };
      }
    });
  });

  let previous = [];
  try { const stored = await idbGetAll(); previous = stored.kodularScheduledIds || []; } catch(e){ previous = []; }

  // Só cancela um alarme se ele pertencia a uma conta que agora foi paga ou excluída
  // (ou seja, não está mais em relevantIds). NUNCA cancela só porque o horário já passou —
  // isso evita cancelar um alarme que o Android ainda não teve chance de disparar.
  const toCancel = previous.filter(id => !relevantIds.has(id));

  // Limite de segurança: o Android permite no máximo 500 alarmes simultâneos por app.
  // Se por acaso houver muitos itens pendentes (dezenas de transações não consolidadas,
  // por exemplo), priorizamos agendar só os avisos mais PRÓXIMOS de acontecer, pra nunca
  // estourar esse teto e travar o app.
  const MAX_ALARMS_AGENDADOS = 400;
  let desiredIds = Object.keys(desired).map(Number);
  if(desiredIds.length > MAX_ALARMS_AGENDADOS){
    desiredIds.sort((a, b) => desired[a].minutes - desired[b].minutes);
    desiredIds = desiredIds.slice(0, MAX_ALARMS_AGENDADOS);
  }

  // Formato: CANCEL:id1,id2|SCHEDULE:id~title~body~minutos;id~title~body~minutos
  // Usa "NONE" quando a lista está vazia, para evitar que o split do Kodular
  // descarte o pedaço final vazio (comportamento do split em Java/Kodular).
  const cancelPart = 'CANCEL:' + (toCancel.length ? toCancel.join(',') : 'NONE');
  const scheduleList = desiredIds
    .map(id => `${id}~${desired[id].title}~${desired[id].body}~${desired[id].minutes}`)
    .join(';');
  const schedulePart = 'SCHEDULE:' + (scheduleList ? scheduleList : 'NONE');
  // Segmento extra de diagnóstico (TEMPORÁRIO). O Kodular lê só os índices 1 e 2
  // depois do split por "|", então esse terceiro pedaço não atrapalha os blocos —
  // serve só pra aparecer no Label de debug e entendermos o que está acontecendo.
  const unpaidCount = pendingItemsUnified().length;
  const debugPart = `DEBUG:pendentes=${unpaidCount},bills=${bills.length},tx=${transactions.length},agora=${new Date(now).toLocaleString('pt-BR')},kodular=${runningInsideKodular()}`;
  const payload = `${cancelPart}|${schedulePart}|${debugPart}`;

  try { window.Kodular.setWebViewString(payload); } catch(e){}

  try { await idbSet('kodularScheduledIds', Array.from(relevantIds)); } catch(e){}
}

const monthLabel = (key) => { const [y,m] = key.split('-'); const n=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return `${n[parseInt(m,10)-1]}/${y.slice(2)}`; };
const daysUntil = (dateStr) => { const t=new Date(todayStr()+'T00:00:00'); const d=new Date(dateStr+'T00:00:00'); return Math.round((d-t)/86400000); };
const esc = (s) => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// máscara de moeda (R$) para campos de valor: formata enquanto o usuário digita
function maskCurrencyInput(e){
  const el = e.target;
  let digits = el.value.replace(/\D/g, '');
  if(!digits){ el.value = ''; return; }
  digits = digits.replace(/^0+(?=\d)/, '');
  while(digits.length < 3) digits = '0' + digits;
  const cents = digits.slice(-2);
  let intPart = digits.slice(0, -2).replace(/^0+(?=\d)/, '') || '0';
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  el.value = `R$ ${intPart},${cents}`;
}
function parseCurrencyBRL(str){
  if(!str) return 0;
  const cleaned = String(str).replace(/[^\d,]/g, '').replace(',', '.');
  return parseFloat(cleaned) || 0;
}

const CONFIRM_MSG = 'Deseja confirmar essa alteração?';
const RECURRENCE_MONTHS = { mes:1, trimestre:3, quadrimestre:4, semestre:6, ano:12 };
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function addRecurrence(dateStr, freq, times){
  if(freq === 'semana') return addDays(dateStr, times * 7);
  const months = RECURRENCE_MONTHS[freq] || 1;
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + months * times);
  return d.toISOString().slice(0,10);
}

let CAT_SAIDA = ['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Assinaturas','Outros'];
async function loadCategorias(){

    const stored = await idbGetAll();
    if(Array.isArray(stored.catEntrada) && stored.catEntrada.length) CAT_ENTRADA = stored.catEntrada;
    if(Array.isArray(stored.catSaida) && stored.catSaida.length) CAT_SAIDA = stored.catSaida;

function addCategoria(tipo, nome){
  nome = (nome||'').trim();
  if(!nome) return false;
  const arr = tipo === 'entrada' ? CAT_ENTRADA : CAT_SAIDA;
  if(arr.some(c => c.toLowerCase() === nome.toLowerCase())) return false;
  arr.push(nome);

  return true;
}

  const emUso = transactions.some(t => t.categoria === nome && (tipo === 'entrada' ? t.tipo === 'entrada' : t.tipo === 'saida'))
    || bills.some(b => b.categoria === nome);
  if(emUso && !confirm(`A categoria "${nome}" está em uso em algum lançamento. As transações existentes mantêm o nome da categoria, mas ela deixará de aparecer na lista para novos lançamentos. Continuar?`)) return false;
  if(tipo === 'entrada') CAT_ENTRADA = CAT_ENTRADA.filter(c => c !== nome);
  else CAT_SAIDA = CAT_SAIDA.filter(c => c !== nome);
  saveCategorias();
  return true;
}

// Unifica duas fontes de "coisas pendentes" para os quadros da Visão Geral:
// 1) contas a pagar (aba "A pagar") ainda não pagas — usam o campo "vencimento";
// 2) transações lançadas com data futura/recente e ainda "não consolidadas" — usam o campo "data".
// Isso cobre tanto quem usa a aba "A pagar" quanto quem lança recorrências direto em Transações.
function pendingItemsUnified(){
  const billItems = (bills||[]).filter(b => !b.pago).map(b => ({
    id: b.id, descricao: b.descricao, valor: b.valor, dueDate: b.vencimento, tipo: 'saida', source: 'bill'
  }));
  const txItems = (transactions||[]).filter(t => !t.consolidado && t.tipo !== 'transferencia').map(t => ({
    id: t.id, descricao: t.descricao, valor: t.valor, dueDate: t.data, tipo: t.tipo, source: 'transaction'
  }));
  return [...billItems, ...txItems];
}
function pendingStatus(dueDate){
  const d = daysUntil(dueDate);
  if(d < 0) return 'vencido';
  if(d <= 7) return 'proximo';
  return 'pendente';
}

function balanceOf(accId){
  const acc = accounts.find(a => a.id === accId);
  if(!acc) return 0;
  const delta = transactions.filter(t => t.contaId === accId)
    .reduce((s,t) => s + (t.tipo === 'entrada' ? t.valor : -t.valor), 0);
  return (acc.saldoInicial || 0) + delta;
}
// Mesmo cálculo, mas considerando só transações até hoje (ignora lançamentos futuros
// já cadastrados) — usado nos cartões da aba Contas e na barra lateral de Transações,
// pra mostrar o saldo "do dia" em vez do saldo projetado com lançamentos futuros.
function balanceOfToday(accId){
  const acc = accounts.find(a => a.id === accId);
  if(!acc) return 0;
  const today = todayStr();
  const delta = transactions.filter(t => t.contaId === accId && t.data <= today)
    .reduce((s,t) => s + (t.tipo === 'entrada' ? t.valor : -t.valor), 0);
  return (acc.saldoInicial || 0) + delta;
}
function totalBalance(){ return accounts.filter(a => a.ativo !== false).reduce((s,a) => s + balanceOf(a.id), 0); }
function billStatus(b){
  if(b.pago) return 'pago';
  const d = daysUntil(b.vencimento);
  if(d < 0) return 'vencido';
  if(d <= 7) return 'proximo';
  return 'pendente';
}
function stampLabel(status){
  return { pago:['PAGO','#1B4332'], vencido:['VENCIDO','#B3432B'], proximo:['A VENCER','#C9A227'], pendente:['PENDENTE','#5B7B9A'] }[status];
}
function emptyState(iconSvg, title, hint){

}

/* =========================== render root =========================== */
function render(){
  document.getElementById('topBalance').textContent = maskBalance(fmtBRL(totalBalance()));
  document.getElementById('topBalance').className = balancesHidden ? 'value balance-masked' : 'value';
  updateEyeIcon();
  const vb = document.getElementById('versionBadge');
  if (vb) vb.textContent = 'v' + APP_VERSION;
  updateSyncBadge();
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  const fab = document.getElementById('fab');
  fab.classList.toggle('hidden', activeTab === 'dashboard');

  const c = document.getElementById('content');
  if(activeTab === 'dashboard') c.innerHTML = renderDashboard();
  else if(activeTab === 'accounts') c.innerHTML = renderAccounts();
  else if(activeTab === 'transactions') c.innerHTML = renderTransactions();
  else if(activeTab === 'bills') c.innerHTML = renderBills();

  if(activeTab === 'dashboard') renderCharts();
  persist();
}

/* =========================== dashboard =========================== */
function renderDashboard(){
  const thisMonth = todayStr().slice(0,7);
  const monthEntradas = transactions.filter(t => t.tipo==='entrada' && t.data.slice(0,7)===thisMonth).reduce((s,t)=>s+t.valor,0);
  const monthSaidas = transactions.filter(t => t.tipo==='saida' && t.data.slice(0,7)===thisMonth).reduce((s,t)=>s+t.valor,0);
  const pendentes = pendingItemsUnified();
  const pendentesCard = pendentes.filter(item => item.dueDate.slice(0,7) <= thisMonth);
  const upcoming = [...pendentes].sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,5);

  const now = new Date();
  if(!pieChartPeriod) pieChartPeriod = { month: now.getMonth()+1, year: now.getFullYear() };
  const pieSelMonth = pieChartPeriod.month;
  const pieSelYear = pieChartPeriod.year;
  const pieYearsSet = new Set(transactions.filter(t=>t.tipo==='saida').map(t => parseInt(t.data.slice(0,4),10)));
  pieYearsSet.add(now.getFullYear());
  const pieYears = [...pieYearsSet].sort((a,b) => b-a);

  const reminderHtml = upcoming.length ? `<ul class="reminder-list">${upcoming.map(item => {
    const d = daysUntil(item.dueDate); const status = pendingStatus(item.dueDate); const [label,color] = stampLabel(status);
    return `<li class="reminder-row">
      <div><p class="reminder-desc">${esc(item.descricao)}</p>
      <p class="muted small">${item.source==='bill'?'vence':'data'} em ${fmtDate(item.dueDate)} · ${d<0?`${Math.abs(d)} dia(s) atrasado`:d===0?'hoje':`em ${d} dia(s)`}</p></div>
      <div class="reminder-right"><span class="amount ${item.tipo}">${item.tipo==='entrada'?'+':'−'} ${fmtBRL(item.valor)}</span>
      <span class="stamp" style="border-color:${color};color:${color}">${label}</span></div>
    </li>`;
  }).join('')}</ul>` : emptyState(ICONS.check,'Nada pendente','Suas contas a pagar e transações não consolidadas aparecerão aqui.');

  return `<div class="stack">
    <section class="cards">
      <div class="summary-card tone-ink"><div class="summary-icon">${ICONS.wallet}</div><p class="summary-label">Saldo total</p><p class="summary-value ${balancesHidden?'balance-masked':''}">${maskBalance(fmtBRL(totalBalance()))}</p></div>
      <div class="summary-card tone-green"><div class="summary-icon">${ICONS.up}</div><p class="summary-label">Entradas do mês</p><p class="summary-value">${fmtBRL(monthEntradas)}</p></div>
      <div class="summary-card tone-brick"><div class="summary-icon">${ICONS.down}</div><p class="summary-label">Saídas do mês</p><p class="summary-value">${fmtBRL(monthSaidas)}</p></div>
      <div class="summary-card tone-gold"><div class="summary-icon">${ICONS.receipt}</div><p class="summary-label">Contas pendentes</p><p class="summary-value">${pendentesCard.length}</p></div>
    </section>

    <div class="panel"><h2>Entradas x Saídas <span class="muted">últimos 6 meses</span></h2>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>

    <div class="panel"><h2>Saídas por categoria <span class="muted">${MONTH_NAMES[pieSelMonth-1]}/${pieSelYear}</span></h2>
      <div class="period-row" style="margin-bottom:10px;">
        <select id="pieMonthSelect">${MONTH_NAMES.map((m,i) => `<option value="${i+1}" ${i+1===pieSelMonth?'selected':''}>${m}</option>`).join('')}</select>
        <select id="pieYearSelect">${pieYears.map(y => `<option value="${y}" ${y===pieSelYear?'selected':''}>${y}</option>`).join('')}</select>
      </div>
      <div class="chart-wrap" id="pieWrap"><canvas id="pieChart"></canvas></div>
    </div>

    <div class="panel"><h2>Próximos vencimentos</h2>${reminderHtml}</div>
  </div>`;
}

let chartRetryCount = 0;
function renderCharts(){
  if (typeof Chart === 'undefined') {
    if (window.chartJsFailed) { renderChartsFallback(); return; }
    // Ainda carregando: tenta de novo em instantes em vez de depender só do aviso
    // "chartjs-ready" (que pode disparar antes do app terminar de configurar quem o escuta).
    chartRetryCount++;
    if (chartRetryCount > 20) { renderChartsFallback(); return; }
    setTimeout(() => { if (activeTab === 'dashboard') renderCharts(); }, 300);
    return;
  }
  chartRetryCount = 0;
  const now = new Date();
  const map = {};
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    map[key] = { mes: monthLabel(key), entradas:0, saidas:0 };
  }
  transactions.forEach(t => { const key=t.data.slice(0,7); if(map[key]) map[key][t.tipo==='entrada'?'entradas':'saidas'] += t.valor; });
  const monthly = Object.values(map);

  if(barChart) barChart.destroy();
  const barCtx = document.getElementById('barChart');
  if(barCtx){
    barChart = new Chart(barCtx, {
      type:'bar',
      data:{ labels: monthly.map(m=>m.mes), datasets:[
        { label:'Entradas', data: monthly.map(m=>m.entradas), backgroundColor:'#1B4332', borderRadius:4 },
        { label:'Saídas', data: monthly.map(m=>m.saidas), backgroundColor:'#B3432B', borderRadius:4 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ font:{ family:'Inter', size:11 } } },
          tooltip:{ callbacks:{ label:(ctx)=> ` ${ctx.dataset.label}: ${fmtBRL(ctx.raw)}` } } },
        scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } },
          y:{ grid:{ color:'#E1DCCB' }, ticks:{ font:{ size:10 }, callback:(v)=> 'R$'+(v>=1000?(v/1000)+'k':v) } } }
      }
    });
  }

  const now2 = new Date();
  if(!pieChartPeriod) pieChartPeriod = { month: now2.getMonth()+1, year: now2.getFullYear() };
  const pieKey = `${pieChartPeriod.year}-${String(pieChartPeriod.month).padStart(2,'0')}`;
  const pmap = {};
  transactions.filter(t => t.tipo==='saida' && t.data.slice(0,7)===pieKey).forEach(t => { pmap[t.categoria]=(pmap[t.categoria]||0)+t.valor; });
  const pieEntries = Object.entries(pmap);

  const pieWrap = document.getElementById('pieWrap');
  if(pieChart) pieChart.destroy();
  if(pieEntries.length && pieWrap){
    pieWrap.innerHTML = '<canvas id="pieChart"></canvas>';
    pieChart = new Chart(document.getElementById('pieChart'), {
      type:'doughnut',
      data:{ labels: pieEntries.map(e=>e[0]), datasets:[{ data: pieEntries.map(e=>e[1]), backgroundColor: pieEntries.map(e=>categoryColor(e[0])) }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Inter', size:11 }, boxWidth:10 } },
          tooltip:{ callbacks:{ label:(ctx)=> ` ${ctx.label}: ${fmtBRL(ctx.raw)}` } } } }
    });
  } else if(pieWrap){
    pieWrap.outerHTML = emptyState(ICONS.receipt,'Nenhuma saída no período','As categorias de gasto aparecem aqui.');
  }
}

function renderChartsFallback(){
  const msg = emptyState(ICONS.receipt, 'Gráficos indisponíveis', 'Não foi possível carregar os gráficos agora (verifique sua conexão). Seus dados continuam salvos normalmente.')
    + `<button class="btn-ghost small" data-action="retry-charts" style="display:block; margin:8px auto 0 auto;">Tentar novamente</button>`;
  const barWrap = document.getElementById('barChart');
  if (barWrap) barWrap.closest('.chart-wrap').outerHTML = msg;
  const pieWrap = document.getElementById('pieWrap');
  if (pieWrap) pieWrap.outerHTML = msg;
}

/* =========================== agrupamento por dia com saldo do dia =========================== */
function buildDailyBalanceMap(accountId){
  const acc = accounts.find(a => a.id === accountId);
  const all = transactions.filter(t => t.contaId === accountId).sort((a,b) => a.data.localeCompare(b.data));
  let running = acc ? (acc.saldoInicial || 0) : 0;
  const map = {};
  all.forEach(t => { running += (t.tipo === 'entrada' ? t.valor : -t.valor); map[t.data] = running; });
  return map;
}

function renderDayGroupedLedger(accountId, items, selectable){
  if(!items.length) return emptyState(ICONS.empty1, 'Nenhuma transação', 'Sem lançamentos neste período.');
  const sorted = [...items].sort((a,b) => a.data.localeCompare(b.data));
  const balMap = buildDailyBalanceMap(accountId);

  const days = [];
  sorted.forEach(t => {
    let day = days[days.length - 1];
    if(!day || day.date !== t.data){ day = { date: t.data, items: [] }; days.push(day); }
    day.items.push(t);
  });

  return `<div class="day-ledger">${days.map((d, i) => `
    <div class="day-block day-alt-${i % 2}">
      <p class="day-label">${fmtDate(d.date)}</p>
      <ul class="ledger">${d.items.map(t => {
        const sel = selectable && txSelectMode && selectedTx.has(t.id);
        return `
        <li class="ledger-row clickable ${sel ? 'selected' : ''}" data-action="${selectable && txSelectMode ? 'toggle-select-tx' : 'edit-transaction'}" data-id="${t.id}">
          ${selectable && txSelectMode ? `<span class="select-check ${sel?'on':''}">${sel ? ICONS.check2 : ''}</span>` : `<button class="consolidado-toggle ${t.consolidado?'on':''}" data-action="toggle-consolidado" data-id="${t.id}" title="${t.consolidado?'Consolidada':'Pendente'}">${t.consolidado ? ICONS.check2 : ''}</button>`}
          <span class="dot ${t.tipo}"></span>
          <div class="ledger-main">
            <p class="ledger-desc">${esc(t.descricao)}</p>
            <p class="muted small">${esc(t.categoria)}</p>
          </div>
          <span class="amount ${t.tipo}">${t.tipo==='entrada'?'+':'−'} ${fmtBRL(t.valor)}</span>
        </li>`;
      }).join('')}
      </ul>
      <p class="day-balance">Saldo do dia <span class="${(balMap[d.date]||0) < 0 ? 'amount saida' : 'amount entrada'}">${fmtBRL(balMap[d.date]||0)}</span></p>
    </div>`).join('')}</div>`;
}

/* =========================== extrato da conta (aba Contas) =========================== */
const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function statementYears(accountId){
  const years = new Set(transactions.filter(t => t.contaId === accountId).map(t => parseInt(t.data.slice(0,4), 10)));
  years.add(new Date().getFullYear());
  return [...years].sort((a,b) => b - a);
}

function openAccountStatement(accountId, presetMonth, presetYear){
  const acc = accounts.find(a => a.id === accountId);
  if(!acc) return;
  const now = new Date();
  stmtAccountId = accountId;
  stmtMonth = presetMonth || now.getMonth() + 1;
  stmtYear = presetYear || now.getFullYear();

  const years = statementYears(accountId);
  if(presetYear && !years.includes(presetYear)){ years.push(presetYear); years.sort((a,b) => b-a); }
  openModal(`
    <p class="sheet-title">Extrato · ${esc(acc.nome)}</p>
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px;">
      <button class="btn-primary" data-action="add-tx-to-account" data-id="${accountId}" style="flex:1;">+ Nova transação nesta conta</button>
      <button class="btn-ghost small" type="button" data-action="toggle-select-mode-tx">${txSelectMode ? 'Cancelar' : 'Selecionar'}</button>
    </div>
    <div class="stmt-filters">
      <select id="stmtMonth">${MONTH_NAMES.map((m,i) => `<option value="${i+1}" ${i+1===stmtMonth?'selected':''}>${m}</option>`).join('')}</select>
      <select id="stmtYear">${years.map(y => `<option value="${y}" ${y===stmtYear?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div id="stmtResults">${renderStatementBody()}</div>
  `);
}

function renderStatementBody(){
  const acc = accounts.find(a => a.id === stmtAccountId);
  if(!acc) return '';
  const monthKey = `${stmtYear}-${String(stmtMonth).padStart(2,'0')}`;
  const items = transactions.filter(t => t.contaId === stmtAccountId && t.data.slice(0,7) === monthKey);
  lastTxFilteredIds = items.map(t => t.id);

  const entradas = items.filter(t => t.tipo==='entrada').reduce((s,t) => s+t.valor, 0);
  const saidas = items.filter(t => t.tipo==='saida').reduce((s,t) => s+t.valor, 0);

  const summary = `
    <div class="stmt-summary">
      <div><p class="muted small">Entradas</p><p class="amount entrada">${fmtBRL(entradas)}</p></div>
      <div><p class="muted small">Saídas</p><p class="amount saida">${fmtBRL(saidas)}</p></div>
      <div><p class="muted small">Saldo do mês</p><p class="amount ${entradas-saidas>=0?'entrada':'saida'}">${fmtBRL(entradas-saidas)}</p></div>
    </div>`;

  const selBar = txSelectMode ? selectionBar(selectedTx.size, lastTxFilteredIds.length, 'bulk-delete-tx', 'toggle-select-mode-tx', 'select-all-tx', 'transação', 'transações') : '';
  return summary + selBar + renderDayGroupedLedger(stmtAccountId, items, true);
}

function refreshStatementBody(){
  const box = document.getElementById('stmtResults');
  if(box) box.innerHTML = renderStatementBody();
}

// Atualiza a view certa depois de qualquer mudança de seleção/exclusão de transações,
// já que extrato de conta e busca são modais que não fazem parte do render() principal.
function refreshTxListsAfterSelectionChange(){
  if(document.getElementById('stmtResults')){ refreshStatementBody(); return; }
  const searchInput = document.getElementById('searchTxInput');
  if(searchInput){ renderSearchResults(searchInput.value); return; }
  render();
}

document.body.addEventListener('change', (e) => {
  if(e.target.id === 'stmtMonth'){ stmtMonth = parseInt(e.target.value, 10); refreshStatementBody(); }
  if(e.target.id === 'stmtYear'){ stmtYear = parseInt(e.target.value, 10); refreshStatementBody(); }
  if(e.target.id === 'txMonthSelect' || e.target.id === 'txYearSelect'){
    const m = document.getElementById('txMonthSelect');
    const y = document.getElementById('txYearSelect');
    txPeriod = { mode:'month', month: parseInt(m.value,10), year: parseInt(y.value,10) };
    render();
  }
  if(e.target.id === 'txYearOnlySelect'){
    txPeriod = { mode:'year', year: parseInt(e.target.value,10) };
    render();
  }
  if(e.target.id === 'pieMonthSelect' || e.target.id === 'pieYearSelect'){
    const m = document.getElementById('pieMonthSelect');
    const y = document.getElementById('pieYearSelect');
    pieChartPeriod = { month: parseInt(m.value,10), year: parseInt(y.value,10) };
    render();
  }
});

          <span class="dot ${t.tipo}"></span>
